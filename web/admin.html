<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五六零科技 · 数字人展览平台 - 管理后台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-deep: #060d1a;
            --bg-card: rgba(10, 22, 50, 0.75);
            --accent-primary: #00d4ff;
            --accent-secondary: #f0a500;
            --accent-glow: rgba(0, 212, 255, 0.3);
            --text-primary: #e8f4ff;
            --text-muted: #6b8baa;
            --border-glow: rgba(0, 212, 255, 0.25);
            --danger: #ff4d6d;
            --success: #00e5a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            color: var(--text-primary);
            min-height: 100vh;
            padding-top: 80px;
            padding-bottom: 40px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(0, 212, 255, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            right: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(ellipse, rgba(240, 165, 0, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .scanline {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.06) 2px,
                rgba(0, 0, 0, 0.06) 4px
            );
            pointer-events: none;
            z-index: 9998;
        }

        /* ── Navigation ── */
        .navbar-dark-sci {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1030;
            background: rgba(6, 13, 26, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-glow);
            padding: 0 28px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-brand-sci {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }

        .brand-icon-box {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-primary), #0090b0);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 14px;
            color: #060d1a;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.35);
            flex-shrink: 0;
        }

        .brand-text-group {
            display: flex;
            flex-direction: column;
        }

        .brand-name-cn {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .brand-name-en {
            font-size: 0.62rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.3;
        }

        .nav-back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .nav-back-link:hover {
            color: var(--accent-primary);
            background: rgba(0, 212, 255, 0.06);
        }

        /* ── Main Container ── */
        .main-container {
            position: relative;
            z-index: 1;
            padding: 0 28px;
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ── Stats Row ── */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
        }

        .stat-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .stat-icon-box.cyan {
            background: rgba(0, 212, 255, 0.12);
            color: var(--accent-primary);
        }

        .stat-icon-box.green {
            background: rgba(0, 229, 160, 0.12);
            color: var(--success);
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-value {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .stat-value .count-badge {
            font-family: 'Rajdhani', sans-serif;
            color: var(--accent-primary);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px rgba(0, 229, 160, 0.6);
            animation: dotPulse 2s infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-label {
            color: var(--success);
            font-weight: 500;
        }

        .btn-refresh {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            color: var(--accent-primary);
            padding: 10px 22px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
        }

        .btn-refresh:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent-primary);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.15);
        }

        .btn-refresh:active {
            transform: scale(0.97);
        }

        /* ── Content Grid ── */
        .content-grid {
            display: grid;
            grid-template-columns: 5fr 7fr;
            gap: 24px;
        }

        /* ── Sci-fi Cards ── */
        .sci-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .sci-card:hover {
            border-color: rgba(0, 212, 255, 0.35);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.08);
        }

        .sci-card-header {
            padding: 18px 24px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sci-card-header h4 {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .sci-card-header h4 i {
            color: var(--accent-primary);
        }

        .sci-card-body {
            padding: 20px 24px;
        }

        /* ── Config Table ── */
        .config-table {
            margin: 0;
            width: 100%;
        }

        .config-table th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 8px 12px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.08);
            width: 40%;
        }

        .config-table td {
            color: var(--text-primary);
            font-weight: 400;
            font-size: 0.88rem;
            padding: 12px 0 12px 8px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.08);
            vertical-align: middle;
        }

        .config-table tr:last-child th,
        .config-table tr:last-child td {
            border-bottom: none;
        }

        .config-table tr:nth-child(even) th,
        .config-table tr:nth-child(even) td {
            background: rgba(0, 212, 255, 0.02);
        }

        /* ── Session Cards ── */
        .session-card {
            padding: 20px;
            margin-bottom: 16px;
            background: rgba(6, 13, 26, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 12px;
            transition: all 0.3s ease;
            animation: sessionFadeIn 0.35s ease;
        }

        .session-card:last-child {
            margin-bottom: 0;
        }

        .session-card:hover {
            border-color: rgba(0, 212, 255, 0.35);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.08);
        }

        @keyframes sessionFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            /* compatibility: used by JS-generated session cards */
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.08);
        }

        .session-id {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-primary);
            letter-spacing: 0.3px;
        }

        .session-detail-item {
            margin-bottom: 8px;
            font-size: 0.88rem;
            color: var(--text-primary);
        }

        .session-detail-item strong {
            color: var(--text-muted);
            font-weight: 500;
            margin-right: 8px;
        }

        /* ── Badges ── */
        .badge-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge-speaking {
            background: rgba(0, 212, 255, 0.12);
            color: var(--accent-primary);
            border: 1px solid rgba(0, 212, 255, 0.25);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.15);
        }

        .badge-silent {
            background: rgba(107, 139, 170, 0.1);
            color: var(--text-muted);
            border: 1px solid rgba(107, 139, 170, 0.15);
        }

        .badge-recording {
            background: rgba(255, 77, 109, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 77, 109, 0.25);
            animation: recPulse 1.5s infinite;
        }

        @keyframes recPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.3); }
            50%      { box-shadow: 0 0 14px 3px rgba(255, 77, 109, 0.15); }
        }

        /* ── Empty State ── */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3.5rem;
            color: rgba(107, 139, 170, 0.3);
            margin-bottom: 16px;
            display: block;
        }

        .empty-state h5 {
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 0.85rem;
            color: rgba(107, 139, 170, 0.6);
        }

        /* ── Skeleton Loading ── */
        .skeleton {
            background: linear-gradient(90deg, rgba(0, 212, 255, 0.05) 25%, rgba(0, 212, 255, 0.1) 50%, rgba(0, 212, 255, 0.05) 75%);
            background-size: 200% 100%;
            animation: skelLoad 1.5s infinite;
            border-radius: 4px;
            height: 16px;
        }

        @keyframes skelLoad {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ── Pre / Custom Opt ── */
        .session-card pre {
            background: rgba(6, 13, 26, 0.6) !important;
            border: 1px solid rgba(0, 212, 255, 0.1) !important;
            border-radius: 8px !important;
            color: var(--text-primary) !important;
            font-size: 0.75rem !important;
            max-height: 120px;
            overflow-y: auto;
        }

        /* ── Spin ── */
        .spin {
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            from { transform: rotate(0deg); }
            to   { transform: rotate(359deg); }
        }

        /* ── Bootstrap Overrides ── */
        .table {
            --bs-table-bg: transparent;
            --bs-table-color: var(--text-primary);
            margin-bottom: 0;
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar              { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track        { background: rgba(6, 13, 26, 0.5); }
        ::-webkit-scrollbar-thumb        { background: rgba(0, 212, 255, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover  { background: rgba(0, 212, 255, 0.35); }

        /* ── Responsive ── */
        @media (max-width: 992px) {
            .content-grid { grid-template-columns: 1fr; }
            .stats-row    { grid-template-columns: 1fr 1fr; }
            .stats-row .btn-refresh { grid-column: span 2; }
        }

        @media (max-width: 576px) {
            .stats-row { grid-template-columns: 1fr; }
            .stats-row .btn-refresh { grid-column: 1; }
            .brand-name-en { display: none; }
            body { padding-top: 70px; }
            .main-container { padding: 0 16px; }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>

    <!-- ── Navigation ── -->
    <nav class="navbar-dark-sci">
        <a href="#" class="navbar-brand-sci">
            <div class="brand-icon-box">五六</div>
            <div class="brand-text-group">
                <span class="brand-name-cn">五六零科技 · 数字人展览平台</span>
                <span class="brand-name-en">560 TECH · Digital Human Platform</span>
            </div>
        </a>
        <a href="/" class="nav-back-link">
            <i class="bi bi-arrow-left"></i> 返回主控台
        </a>
    </nav>

    <!-- ── Main Content ── -->
    <div class="main-container">

        <!-- Stats Row -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon-box cyan">
                    <i class="bi bi-people-fill"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">活跃会话数</span>
                    <span class="stat-value">
                        <span class="count-badge" id="sessionCount">0</span>
                    </span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon-box green">
                    <i class="bi bi-shield-check"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">系统状态</span>
                    <div class="status-indicator">
                        <span class="status-dot"></span>
                        <span class="status-label">运行中</span>
                    </div>
                </div>
            </div>
            <button class="btn-refresh" onclick="refreshData()">
                <i class="bi bi-arrow-clockwise"></i>
                <span>刷新数据</span>
            </button>
        </div>

        <!-- Content Grid -->
        <div class="content-grid">

            <!-- Config Section -->
            <div class="sci-card">
                <div class="sci-card-header">
                    <h4><i class="bi bi-gear-fill"></i> 系统配置</h4>
                </div>
                <div class="sci-card-body">
                    <div class="table-responsive">
                        <table class="table table-borderless config-table" id="configTable">
                            <tbody>
                                <tr>
                                    <th>加载中...</th>
                                    <td><div class="skeleton"></div></td>
                                </tr>
                                <tr>
                                    <th>加载中...</th>
                                    <td><div class="skeleton"></div></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Sessions Section -->
            <div class="sci-card">
                <div class="sci-card-header">
                    <h4><i class="bi bi-people-fill"></i> 活跃会话</h4>
                </div>
                <div class="sci-card-body">
                    <div id="sessionsContainer">
                        <div class="session-card" style="background:rgba(6,13,26,0.5);border:1px solid rgba(0,212,255,0.15);border-radius:12px;padding:20px;">
                            <div class="skeleton mb-3" style="width:40%;height:28px;"></div>
                            <div class="skeleton mb-2" style="width:80%;"></div>
                            <div class="skeleton" style="width:60%;"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        const configLabels = {
            'model': '数字人模型',
            'avatar_id': '默认角色 ID',
            'tts': 'TTS 引擎',
            'REF_FILE': '语音参考',
            'transport': '流媒体协议',
            'listenport': '监听端口',
            'batch_size': '推理批次 (Batch)',
            'fps': '视频帧率 (FPS)',
            'push_url': '推流地址'
        };

        async function fetchConfig() {
            try {
                const response = await fetch('/api/admin/config');
                const result = await response.json();
                if (result.code === 0) {
                    renderConfig(result.data.config);
                } else {
                    console.error('Failed to fetch config:', result.msg);
                }
            } catch (err) {
                console.error('Network error fetching config', err);
            }
        }

        async function fetchSessions() {
            try {
                const response = await fetch('/api/admin/sessions');
                const result = await response.json();
                if (result.code === 0) {
                    renderSessions(result.data.sessions);
                    $('#sessionCount').text(result.data.sessions.length);
                } else {
                    console.error('Failed to fetch sessions:', result.msg);
                }
            } catch (err) {
                console.error('Network error fetching sessions', err);
            }
        }

        function renderConfig(config) {
            const tableBody = $('#configTable tbody');
            tableBody.empty();

            for (const [key, label] of Object.entries(configLabels)) {
                if (config[key] !== undefined) {
                    const val = config[key] === '' ? '<span class="text-muted">未设置</span>' : config[key];
                    tableBody.append(`
                        <tr>
                            <th>${label}</th>
                            <td>${val}</td>
                        </tr>
                    `);
                }
            }
        }

        function renderSessions(sessions) {
            const container = $('#sessionsContainer');
            container.empty();

            if (sessions.length === 0) {
                container.append(`
                    <div class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <h5>暂无活跃的会话连接</h5>
                        <p>当用户在前端发起连接时，此列表将自动更新。</p>
                    </div>
                `);
                return;
            }

            sessions.forEach(session => {
                const statusBadge = session.speaking
                    ? `<span class="badge-status badge-speaking"><i class="bi bi-mic-fill"></i> 说话中</span>`
                    : `<span class="badge-status badge-silent"><i class="bi bi-mic-mute-fill"></i> 静音</span>`;

                const recBadge = session.recording
                    ? `<span class="badge-status badge-recording ms-2"><i class="bi bi-record-circle"></i> 录制中</span>`
                    : '';

                const customOptContent = session.customopt && session.customopt.length > 0
                    ? `<pre class="mt-1 p-2 bg-light border rounded text-dark" style="font-size: 0.75rem; max-height: 120px; overflow-y: auto;">${JSON.stringify(session.customopt, null, 2)}</pre>`
                    : '<span class="text-muted">无</span>';

                container.append(`
                    <div class="session-card glass-card">
                        <div class="session-header">
                            <div>
                                <span class="session-id">SID: ${session.sessionid}</span>
                                <div class="mt-2 text-muted" style="font-size: 0.85rem;">传输层: ${session.transport || '默认'}</div>
                            </div>
                            <div>
                                ${statusBadge}
                                ${recBadge}

                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="session-detail-item">
                                    <strong>角色ID:</strong> ${session.avatar_id}
                                </div>
                                <div class="session-detail-item">
                                    <strong>核心模型:</strong> ${session.model}
                                </div>

                            </div>
                            <div class="col-md-6">
                                <div class="session-detail-item">
                                    <strong>语音参考:</strong> ${session.REF_FILE}
                                </div>
                                <div class="session-detail-item mt-2">
                                    <strong><i class="bi bi-sliders"></i> 动作编排:</strong>
                                    ${customOptContent}
                                </div>
                            </div>
                        </div>

                    </div>
                `);
            });
        }

        function refreshData() {
            const icon = $('.bi-arrow-clockwise');
            icon.addClass('spin');

            Promise.all([fetchConfig(), fetchSessions()]).finally(() => {
                setTimeout(() => icon.removeClass('spin'), 500);
            });
        }

        $('<style> .spin { animation: rotation 1s linear infinite; } @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(359deg); } } </style>').appendTo('head');

        $(document).ready(() => {
            fetchConfig();
            fetchSessions();

            setInterval(fetchSessions, 5000);
        });
    </script>
</body>
</html>
