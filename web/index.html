<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五六零科技 · 数字人展览平台 | 560 TECH · Digital Human Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* ═══════════════ Design System ─────────────────────────────── */
        :root {
            --bg-deep: #080d1a;
            --bg-surface: rgba(12, 22, 48, 0.85);
            --bg-elevated: rgba(16, 30, 60, 0.9);
            --accent: #00d4ff;
            --accent-warm: #f0a500;
            --accent-glow: rgba(0, 212, 255, 0.25);
            --success: #00e5a0;
            --danger: #ff4d6d;
            --text: #e4ecf7;
            --text-dim: #5b7a9a;
            --border: rgba(0, 212, 255, 0.12);
            --border-glow: rgba(0, 212, 255, 0.22);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 5px;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --duration-normal: 250ms;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Ambient Background ─────────────────────────────────────── */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 70% 60% at 30% 60%, rgba(0, 212, 255, 0.04) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 75% 30%, rgba(240, 165, 0, 0.03) 0%, transparent 70%),
                linear-gradient(rgba(0, 212, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.025) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 64px 64px, 64px 64px;
        }

        /* ── App Shell ───────────────────────────────────────────────── */
        #app {
            position: relative; z-index: 2;
            display: flex; flex-direction: column;
            height: 100vh; width: 100%;
        }

        /* ═══════════════ Top Bar ──────────────────────────────────── */
        #topbar {
            height: 48px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
            background: rgba(8, 13, 26, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0; z-index: 100;
        }
        #topbar .brand {
            display: flex; align-items: center; gap: 10px;
            font-family: 'Rajdhani', sans-serif; font-weight: 700;
            font-size: 1.15rem; letter-spacing: 0.5px;
            text-decoration: none;
        }
        #topbar .brand i {
            color: var(--accent); font-size: 1.3rem;
            filter: drop-shadow(0 0 6px var(--accent-glow));
        }
        #topbar .brand .zh { color: var(--accent-warm); }
        #topbar .brand .en {
            color: var(--accent); font-size: 0.7rem; font-weight: 600;
            opacity: 0.7; margin-left: 2px;
        }
        #topbar .brand .sep { color: rgba(255,255,255,0.12); margin: 0 2px; font-weight: 400; }

        #topbar .right-group {
            display: flex; align-items: center; gap: 14px;
        }
        #topbar .session-badge {
            font-size: 0.7rem; padding: 4px 10px; border-radius: 20px;
            font-weight: 600; font-family: 'Rajdhani', sans-serif; letter-spacing: 0.4px;
            display: flex; align-items: center; gap: 6px;
            transition: all 0.3s;
        }
        .session-badge.connected {
            background: rgba(0, 229, 160, 0.1);
            color: var(--success); border: 1px solid rgba(0, 229, 160, 0.25);
            box-shadow: 0 0 10px rgba(0, 229, 160, 0.1);
        }
        .session-badge.disconnected {
            background: rgba(255, 77, 109, 0.08);
            color: var(--danger); border: 1px solid rgba(255, 77, 109, 0.15);
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .status-dot.on { background: var(--success); box-shadow: 0 0 6px var(--success); }
        .status-dot.off { background: var(--danger); }
        #sessionIdDisplay {
            font-family: 'Rajdhani', sans-serif; font-size: 0.7rem;
            color: var(--text-dim); letter-spacing: 0.3px; white-space: nowrap;
        }
        .btn-settings {
            width: 34px; height: 34px; border-radius: 8px;
            background: transparent; border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-dim); cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            font-size: 1rem; transition: all var(--duration-normal) var(--ease-out);
        }
        .btn-settings:hover { color: var(--accent); border-color: var(--accent); background: rgba(0,212,255,0.06); }
        .btn-settings.active { color: var(--accent); border-color: var(--accent); background: rgba(0,212,255,0.1); }

        .btn-top-link {
            font-size: 0.73rem; color: var(--text-dim); text-decoration: none;
            padding: 4px 8px; border-radius: 5px; transition: all 0.2s;
            display: flex; align-items: center; gap: 4px;
        }
        .btn-top-link:hover { color: var(--accent); background: rgba(0,212,255,0.06); }
        .btn-top-link.danger:hover { color: var(--danger); background: rgba(255,77,109,0.06); }

        /* ═══════════════ Settings Drawer ──────────────────────────── */
        #settingsDrawer {
            background: rgba(12, 20, 40, 0.97);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-glow);
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.4s var(--ease-out), padding 0.4s var(--ease-out), border-color 0.4s var(--ease-out);
            flex-shrink: 0; z-index: 99;
        }
        #settingsDrawer.open {
            max-height: 340px;
            border-bottom-color: var(--border-glow);
        }
        #settingsDrawer .drawer-inner {
            padding: 0 20px; transition: padding 0.4s var(--ease-out);
        }
        #settingsDrawer.open .drawer-inner { padding: 16px 20px; }
        #settingsDrawer .section-title {
            font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 0.72rem;
            color: var(--accent); text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
        }
        #settingsDrawer .section-title::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, rgba(0,212,255,0.15), transparent);
        }
        #settingsDrawer .config-row {
            display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
        }
        #settingsDrawer .config-row:last-child { margin-bottom: 4px; }
        #settingsDrawer .field {
            display: flex; flex-direction: column; gap: 4px; min-width: 140px; flex: 1;
        }
        #settingsDrawer .field label {
            font-size: 0.68rem; color: var(--text-dim); letter-spacing: 0.3px;
            font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 5px;
        }
        #settingsDrawer .field label i { color: var(--accent); font-size: 0.7rem; opacity: 0.7; }

        /* ── Dark Select / Input ────────────────────────────────────── */
        .dark-select, .dark-input {
            background: rgba(6, 14, 30, 0.7);
            border: 1px solid rgba(0, 212, 255, 0.12);
            border-radius: var(--radius-xs);
            color: var(--text); font-size: 0.76rem;
            padding: 6px 10px; font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .dark-select:hover, .dark-input:hover { border-color: rgba(0,212,255,0.25); }
        .dark-select:focus, .dark-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.06);
        }
        .dark-select option { background: #0a1632; color: var(--text); }
        .dark-input::placeholder { color: rgba(123, 150, 180, 0.4); }
        .field-hint { font-size: 0.65rem; color: rgba(123,150,180,0.5); margin-top: 1px; }

        /* ── Buttons ────────────────────────────────────────────────── */
        .btn-accent {
            background: linear-gradient(135deg, #00a8cc, #0088aa);
            border: none; color: #fff; font-weight: 600;
            font-size: 0.78rem; border-radius: var(--radius-xs);
            padding: 7px 16px; cursor: pointer;
            font-family: 'Rajdhani', sans-serif; letter-spacing: 0.5px;
            transition: all 0.2s var(--ease-out);
            display: inline-flex; align-items: center; gap: 5px;
            white-space: nowrap;
        }
        .btn-accent:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,168,204,0.3); }
        .btn-accent:active { transform: translateY(0); }
        .btn-danger-sm {
            background: linear-gradient(135deg, #e63946, #c1121f);
            border: none; color: #fff; font-weight: 600;
            font-size: 0.78rem; border-radius: var(--radius-xs);
            padding: 7px 16px; cursor: pointer;
            font-family: 'Rajdhani', sans-serif; letter-spacing: 0.5px;
            transition: all 0.2s; white-space: nowrap;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .btn-danger-sm:hover { box-shadow: 0 4px 16px rgba(230,57,70,0.3); }
        .btn-ghost {
            background: transparent; border: 1px solid rgba(0,212,255,0.3);
            color: var(--accent); font-weight: 600; font-size: 0.76rem;
            border-radius: var(--radius-xs); padding: 6px 14px; cursor: pointer;
            font-family: 'Rajdhani', sans-serif; letter-spacing: 0.4px;
            transition: all 0.2s; white-space: nowrap;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .btn-ghost:hover { background: rgba(0,212,255,0.08); border-color: var(--accent); }
        .btn-ghost:disabled { opacity: 0.35; cursor: not-allowed; }
        .btn-ghost:disabled:hover { background: transparent; border-color: rgba(0,212,255,0.3); }
        .field .btn-accent, .field .btn-ghost { font-size: 0.72rem; padding: 5px 10px; }

        /* ── Toggle Switch ──────────────────────────────────────────── */
        .toggle-wrap {
            display: inline-flex; align-items: center; gap: 7px;
            cursor: pointer; user-select: none;
        }
        .toggle-wrap input { display: none; }
        .toggle-slider {
            position: relative; width: 38px; height: 20px;
            background: rgba(255,255,255,0.15); border-radius: 20px;
            transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1);
        }
        .toggle-slider::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 14px; height: 14px; background: #fff;
            border-radius: 50%; transition: transform 0.25s var(--ease-spring);
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .toggle-wrap input:checked + .toggle-slider {
            background: var(--accent); border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }
        .toggle-wrap input:checked + .toggle-slider::after { transform: translateX(18px); }
        .toggle-label { font-size: 0.72rem; color: var(--text-dim); }

        /* ═══════════════ Main Split Layout ─────────────────────────── */
        #mainContent {
            display: flex; flex: 1; min-height: 0;
            gap: 1px; background: var(--border);
            position: relative;
        }

        /* ── Video Panel ────────────────────────────────────────────── */
        #videoPanel {
            flex: 5; display: flex; flex-direction: column;
            background: var(--bg-deep); position: relative;
            min-width: 0;
        }
        #videoPanel .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 14px; background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
        }
        #videoPanel .panel-title {
            font-family: 'Rajdhani', sans-serif; font-weight: 600;
            font-size: 0.8rem; color: var(--text-dim); letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 6px;
        }
        #videoPanel .panel-title i { color: var(--accent); font-size: 0.85rem; }

        .video-stage {
            flex: 1; position: relative; overflow: hidden;
            background: #000; min-height: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .video-stage video {
            width: 100%; height: 100%; object-fit: contain;
            display: block; background: #000;
        }
        .video-stage audio { display: none; }

        /* Fullscreen wrapper */
        .video-fs-wrapper {
            width: 100%; height: 100%; position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .video-fs-wrapper:fullscreen,
        .video-fs-wrapper:-webkit-full-screen {
            display: flex; align-items: center; justify-content: center;
            background: #000; width: 100vw; height: 100vh;
        }
        .video-fs-wrapper:fullscreen video,
        .video-fs-wrapper:-webkit-full-screen video { max-width: 100%; max-height: 100vh; width: auto; height: auto; }

        /* ── Loading Overlay ────────────────────────────────────────── */
        .video-loading-overlay {
            position: absolute; inset: 0; z-index: 30;
            background: rgba(6, 12, 24, 0.8);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.3s, visibility 0.3s;
            border-radius: 4px;
        }
        .loading-box {
            background: rgba(14, 24, 44, 0.9);
            border: 1px solid rgba(0,212,255,0.25);
            border-radius: var(--radius); padding: 22px 28px;
            max-width: 360px; width: 100%; text-align: center;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
        }
        .loading-pulse {
            width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 50%;
            background: rgba(0,212,255,0.1); border: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: var(--accent);
            animation: pulseGlow 1.5s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(0,212,255,0.35); transform: scale(1); }
            70% { box-shadow: 0 0 0 14px rgba(0,212,255,0); transform: scale(1.04); }
            100% { box-shadow: 0 0 0 0 rgba(0,212,255,0); transform: scale(1); }
        }
        .loading-title { font-size: 0.9rem; font-weight: 600; color: #fff; margin-bottom: 3px; }
        .loading-sub { font-size: 0.72rem; color: rgba(255,255,255,0.5); margin-bottom: 12px; }
        .step-dots { display: flex; justify-content: center; gap: 8px; }
        .step-dots .c-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: rgba(255,255,255,0.15); transition: all 0.3s;
        }
        .step-dots .c-dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); transform: scale(1.3); }
        .step-dots .c-dot.done { background: var(--success); }

        /* ── Fullscreen Triggers ────────────────────────────────────── */
        .fs-trigger {
            position: absolute; bottom: 8px; right: 8px;
            background: rgba(0,0,0,0.65); color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 4px;
            padding: 4px 10px; cursor: pointer; font-size: 14px; z-index: 10;
            opacity: 0.5; transition: opacity 0.2s, background 0.2s;
        }
        .fs-trigger:hover { opacity: 1; background: rgba(0,212,255,0.15); border-color: var(--accent); }
        .video-fs-wrapper:fullscreen .fs-trigger,
        .video-fs-wrapper:-webkit-full-screen .fs-trigger { opacity: 0.85; }

        .fs-toolbar {
            display: none; position: fixed; top: 12px; right: 12px;
            z-index: 2147483647; gap: 8px; align-items: center;
        }
        .video-fs-wrapper:fullscreen .fs-toolbar,
        .video-fs-wrapper:-webkit-full-screen .fs-toolbar { display: flex; }
        .fs-toolbar button {
            background: rgba(0,0,0,0.7); color: var(--text);
            border: 1px solid rgba(0,212,255,0.3); border-radius: 6px;
            padding: 7px 14px; cursor: pointer; font-size: 13px;
            font-family: 'Rajdhani', sans-serif; font-weight: 600;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s;
        }
        .fs-toolbar button:hover { background: rgba(0,212,255,0.15); border-color: var(--accent); }
        .fs-toolbar button.active { background: rgba(0,212,255,0.2); border-color: var(--accent); box-shadow: 0 0 10px rgba(0,212,255,0.15); }

        /* ── Fullscreen Side Panel ──────────────────────────────────── */
        .fs-side-panel { display: none; }
        .video-fs-wrapper:fullscreen .fs-side-panel,
        .video-fs-wrapper:-webkit-full-screen .fs-side-panel {
            display: none; flex-direction: column; position: absolute;
            top: 0; right: 0; width: 380px; height: 100vh;
            overflow-y: auto; padding: 14px; gap: 14px;
            background: rgba(6,13,26,0.95); color: var(--text); z-index: 100;
            border-left: 1px solid var(--border-glow);
        }
        .video-fs-wrapper:fullscreen.fs-panel-open .fs-side-panel,
        .video-fs-wrapper:-webkit-full-screen.fs-panel-open .fs-side-panel { display: flex; }
        .video-fs-wrapper:fullscreen.fs-panel-open .fs-toolbar,
        .video-fs-wrapper:-webkit-full-screen.fs-panel-open .fs-toolbar {
            right: auto; left: 12px;
        }

        .fs-glass-card {
            background: rgba(10,22,50,0.85); backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow); border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .fs-card-header {
            padding: 12px 16px; font-weight: 600;
            font-family: 'Rajdhani', sans-serif; color: var(--text);
            border-bottom: 1px solid rgba(0,212,255,0.1);
            display: flex; align-items: center; gap: 6px;
        }
        .fs-card-header i { color: var(--accent); }
        .fs-card-body { padding: 12px 16px; }
        .fs-side-panel .chat-panel { height: auto; flex: 1; min-height: 0; }
        .fs-side-panel .dark-select, .fs-side-panel .dark-input { background: rgba(0,0,0,0.35); }

        /* ═══════════════ Chat Panel ────────────────────────────────── */
        #chatPanel {
            flex: 4; display: flex; flex-direction: column;
            background: var(--bg-surface);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-left: 1px solid var(--border);
            min-width: 360px; max-width: 480px;
        }
        #chatPanel .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 14px; flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            background: rgba(0,0,0,0.2);
        }
        #chatPanel .panel-title {
            font-family: 'Rajdhani', sans-serif; font-weight: 600;
            font-size: 0.8rem; color: var(--text-dim); letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 6px;
        }
        #chatPanel .panel-title i { color: var(--accent); font-size: 0.85rem; }

        .chat-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; }

        .chat-messages {
            flex: 1; overflow-y: auto; padding: 12px 14px 6px;
            display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.2); border-radius: 4px; }

        .bubble-row { display: flex; align-items: flex-end; gap: 8px; }
        .bubble-row.user { flex-direction: row-reverse; }
        .bubble-content { max-width: 75%; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
        .bubble-row.user .bubble-content { align-items: flex-end; }
        .bubble-avatar-icon {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #7b2ff7);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; flex-shrink: 0; color: #fff;
            box-shadow: 0 2px 8px rgba(0,212,255,0.35);
        }
        .bubble-user-icon {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #10b981, #059669);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; flex-shrink: 0; color: #fff;
            box-shadow: 0 2px 8px rgba(16,185,129,0.35);
        }
        .bubble {
            padding: 8px 13px; border-radius: 16px;
            font-size: 0.84rem; line-height: 1.5; word-break: break-word;
            animation: bubbleIn 0.22s var(--ease-spring);
            width: fit-content; max-width: 100%;
        }
        @keyframes bubbleIn { from { opacity: 0; transform: scale(0.85) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .bubble-row.avatar .bubble {
            background: rgba(0,212,255,0.06); border: 1px solid rgba(0,212,255,0.15);
            border-bottom-left-radius: 4px; color: var(--text);
        }
        .bubble-row.user .bubble {
            background: linear-gradient(135deg, rgba(0,212,255,0.22), rgba(0,150,200,0.25));
            border: 1px solid rgba(0,212,255,0.3); color: #fff;
            border-bottom-right-radius: 4px; box-shadow: 0 2px 10px rgba(0,212,255,0.15);
        }
        .bubble-system-row { display: flex; justify-content: center; }
        .bubble-system {
            font-size: 0.7rem; color: #526580;
            background: rgba(255,255,255,0.03); border-radius: 20px;
            padding: 2px 12px; animation: bubbleIn 0.18s ease;
        }
        .bubble-interim { opacity: 0.5; font-style: italic; }
        .bubble-timestamp { font-size: 0.6rem; color: #526580; margin-top: 2px; text-align: right; }
        .bubble-row.avatar .bubble-timestamp { text-align: left; }

        .chat-status-row { display: flex; justify-content: center; min-height: 20px; padding: 0 12px; }
        .chat-status-pill {

            flex: 1; resize: none; border-radius: 18px;

        .chat-input-bar textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.08); }
        .chat-input-bar textarea::placeholder { color: #3a4a5e; }

        .btn-send {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, #00c8ee, #0088bb);
            border: none; color: #060d1a; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;

        }
        .btn-send:hover { transform: scale(1.12); box-shadow: 0 5px 16px rgba(0,200,238,0.5); }
        .btn-send:active { transform: scale(0.93); }

        .btn-mic {
            width: 36px; height: 36px; border-radius: 50%;
            border: 1.5px solid rgba(0,212,255,0.35);
            background: transparent; color: var(--accent); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; flex-shrink: 0; transition: all 0.2s;
        }
        .btn-mic:hover { background: rgba(0,212,255,0.08); }
        .btn-mic.free-active {

        @keyframes freePulse {

<script>
// ── Settings Drawer Toggle ─────────────────────────────────────
function toggleSettingsDrawer() {
    const drawer = document.getElementById('settingsDrawer');
    const btn = document.getElementById('btnSettingsToggle');
    const isOpen = drawer.classList.toggle('open');
    btn.classList.toggle('active', isOpen);
}

// ── Toggle Config Panel (stub for JS compat) ───────────────────
function toggleConfigPanel() {
    toggleSettingsDrawer();
}

// ── Load Avatars ───────────────────────────────────────────────
async function loadAvatars() {
    const select = document.getElementById('offerAvatar');
    const statusEl = document.getElementById('avatarStatus');
    try {
        const resp = await fetch('/api/avatars');
        const json = await resp.json();
        if (json.code === 0 && json.data && json.data.avatars) {
            const avatars = json.data.avatars;
            const defaultId = json.data.default || '';
            select.innerHTML = '';
            if (avatars.length === 0) {
                select.innerHTML = '<option value="">无可用形象</option>';
                if (statusEl) statusEl.textContent = '请先创建数字人形象';
            } else {
                avatars.forEach(id => {
                    const opt = document.createElement('option');
                    opt.value = id;
                    opt.textContent = (id === defaultId) ? id + ' (默认模型)' : id;
                    if (id === defaultId) opt.selected = true;
                    select.appendChild(opt);
                });
                if (statusEl) statusEl.textContent = '共 ' + avatars.length + ' 个可用数字人模型';
            }
        }
    } catch (e) {
        console.warn('Network fetch skipped for avatars, keeping pre-populated options:', e);
    }
}
document.addEventListener('DOMContentLoaded', loadAvatars);
loadAvatars();

// ═══════════════ WebRTC ════════════════════════════════════════
let pc = null;
let sessionid = null;

function updateStatus(connected) {
    const badge = document.getElementById('statusBadge');
    if (connected) {
        badge.className = 'session-badge connected';
        badge.innerHTML = '<span class="status-dot on"></span>已连接';
    } else {
        badge.className = 'session-badge disconnected';
        badge.innerHTML = '<span class="status-dot off"></span>未连接';
    }
}

function setSessionId(sid) {
    sessionid = sid;
    document.getElementById('sessionIdDisplay').textContent = 'SID: ' + (sid || '-');
    document.getElementById('sessionid').value = sid || '';
}

let _reconnectAttempts = 0;
const RECONNECT_MAX = 3;
const RECONNECT_BASE_DELAY = 2000;

function negotiate() {
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    setWebRTCStep(2, '正在加载数字人模型...', '预加载 3D 形象与动态渲染', 'bi-person-badge');
    return pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
        return new Promise(resolve => {
            if (pc.iceGatheringState === 'complete') resolve();
            else {
                const check = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', check); resolve(); } };
                pc.addEventListener('icegatheringstatechange', check);
            }
        });
    }).then(() => {
        const offer = pc.localDescription;
        const body = {
            sdp: offer.sdp,
            type: offer.type,
            avatar: document.getElementById('offerAvatar').value || undefined,
            refaudio: document.getElementById('ttsVoice').value || undefined,
            reftext: document.getElementById('offerRefText')?.value || undefined,
        };
        setWebRTCStep(3, '正在初始化语音引擎...', '配置高清音轨与推流响应', 'bi-soundwave');
        return fetch('/offer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }).then(res => res.json()).then(answer => {
        if (answer.sessionid) setSessionId(answer.sessionid);
        return pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answer.sdp }));
    }).then(() => {
        _reconnectAttempts = 0;
    }).catch(e => {
        console.error('Negotiation error:', e);
        throw e;
    });
}

function _attemptReconnect() {
    if (_reconnectAttempts >= RECONNECT_MAX) {
        console.warn('WebRTC 重连失败，已达最大重试次数');
        updateStatus(false);
        setSessionId(null);
        document.getElementById('btnStart').style.display = 'inline-flex';
        document.getElementById('btnStop').style.display = 'none';
        return;
    }
    _reconnectAttempts++;
    const delay = RECONNECT_BASE_DELAY * Math.pow(2, _reconnectAttempts - 1);
    console.log(`WebRTC 重连 (${_reconnectAttempts}/${RECONNECT_MAX})，${delay}ms 后重试...`);
    setTimeout(() => {
        try {
            if (pc) { try { pc.close(); } catch(e) {} pc = null; }
            _setupConnection();
            negotiate().catch(() => _attemptReconnect());
        } catch(e) {
            console.error('重连异常:', e);
            _attemptReconnect();
        }
    }, delay);
}

function _setupConnection() {
    const config = {
        sdpSemantics: 'unified-plan',
        iceServers: [{ urls: 'stun:stun.qq.com:3478' }],
    };
    pc = new RTCPeerConnection(config);
    pc.addEventListener('track', evt => {
        if (evt.track.kind === 'video') document.getElementById('video').srcObject = evt.streams[0];
        else document.getElementById('audio').srcObject = evt.streams[0];
    });
    pc.addEventListener('connectionstatechange', () => {
        if (pc.connectionState === 'connected') {
            updateStatus(true);
            _reconnectAttempts = 0;
        } else if (pc.connectionState === 'disconnected') {
            console.warn('WebRTC 连接断开，尝试自动重连...');
            _attemptReconnect();
        } else if (pc.connectionState === 'failed') {
            console.error('WebRTC 连接失败，尝试自动重连...');
            _attemptReconnect();
        }
    });
}

// ═══════════════ Voice Interaction ════════════════════════════
let voiceMode = 'off';
let voiceRecognition = null;
let voiceEnabled = false;
let voicePollTimer = null;
let voiceLastFinalText = '';
let voiceWaitingForReply = false;
let voiceRestartCount = 0;
let voiceCooldownTimer = null;
let voiceLastSentText = '';
let voiceWaitingTimeout = null;
const VOICE_WAITING_MAX_MS = 60000;
const VOICE_WAITING_START_MS = 10000;

let localASR = {
    ws: null, stream: null, audioCtx: null, source: null, processor: null,
    captureActive: false, mode: null, pendingResolve: null, pendingText: '',
    ready: false, closing: false,
    vadSilenceMs: 0, vadSpeechDetected: false, vadStartTime: 0,
    vadConfig: {
        silenceThreshold: 0.01, silenceDurationMs: 1500,
        minSpeechMs: 300, maxCaptureMs: 30000,
    },
};

const VOICE_MAX_RESTART = 3;
const VOICE_ECHO_COOLDOWN_MS = 2000;
const VOICE_TEXT_MIN_LENGTH = 3;
let _avatarSpeaking = false;
let _avatarSpeakEndTime = 0;
let _avatarRecentTexts = [];
const AVATAR_TEXT_HISTORY_MAX = 10;

function onVoiceModeChange() {
    const newMode = document.getElementById('voiceMode').value;
    if (newMode === voiceMode) return;

    stopVoiceMode();

                }
            });
        }
    } else if (newMode === 'ptt') {

// ── Free Conversation Mode ────────────────────────────────────
function startFreeRecognition() {
    if (!voiceEnabled || voiceWaitingForReply) return;

    try {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        voiceRecognition = new SpeechRecognition();
        voiceRecognition.continuous = true;
        voiceRecognition.interimResults = true;
        voiceRecognition.lang = 'zh-CN';

        voiceRecognition.onresult = function(event) {
            let finalText = '';
            let interimText = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalText += event.results[i][0].transcript;
                } else {
                    interimText += event.results[i][0].transcript;
                }
            }

            if (interimText) {
                showVoiceTranscript(finalText || interimText, true);
                showVoiceStatus(true, '📝', '识别中...');
            }

            if (finalText) {
                const text = finalText.trim();
                showVoiceTranscript(text, false);

                if (!isValidVoiceInput(text)) return;
                voiceLastFinalText = text;

                if (voiceRecognition) {
                    try { voiceRecognition.stop(); } catch(e) {}
                    voiceRecognition = null;
                }

                if (voiceWaitingForReply) {
                    showVoiceStatus(true, '⏳', '打断中...');
                    fetch('/interrupt_talk', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionid: String(sessionid) }),
                    }).then(() => sendVoiceText(text, true))
                      .catch(() => sendVoiceText(text, true));
                } else {
                    sendVoiceText(text, true);
                }
            }
        };

        voiceRecognition.onerror = function(event) {
            console.error('语音识别错误:', event.error);
            if (event.error === 'aborted') return;

            if (event.error === 'audio-capture' || event.error === 'no-speech') {
                showVoiceStatus(true, '⚠️', event.error === 'audio-capture' ? '未检测到麦克风' : '语音识别不可用');
                setTimeout(() => resetVoiceMode(), 2000);
                return;
            }

            if (event.error === 'network') {
                console.log('SpeechRecognition network error, falling back to local ASR');
                showVoiceStatus(true, '🔄', '切换到本地语音识别...');
                if (voiceRecognition) { try { voiceRecognition.stop(); } catch(e) {} voiceRecognition = null; }
                warmupLocalASR('free', () => {
                    if (voiceMode === 'free' && voiceEnabled) {
                        startCapture();
                        showVoiceStatus(true, '🎤', '聆听中...（本地ASR）');
                    }
                });
                return;
            }

            if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                showVoiceStatus(true, '⏳', '请求麦克风权限...');
                voiceRecognition = null;
                _requestMicPermission().then(granted => {
                    if (granted && voiceEnabled && !voiceWaitingForReply && !voiceCooldownTimer) {
                        startFreeRecognition();
                    }
                });
                return;
            }

            if (voiceEnabled && !voiceWaitingForReply) {
                voiceRestartCount++;
                if (voiceRestartCount <= VOICE_MAX_RESTART) {
                    setTimeout(() => startFreeRecognition(), 500);
                } else {
                    showVoiceStatus(true, '⚠️', '识别异常');
                    setTimeout(() => resetVoiceMode(), 2000);
                }
            }
        };

        voiceRecognition.onend = function() {
            if (voiceEnabled && !voiceWaitingForReply && !voiceCooldownTimer) {
                startFreeRecognition();
            }
        };

        voiceRecognition.start();
    } catch (e) {
        console.error('启动语音识别失败:', e);
        warmupLocalASR('free', () => {
            if (voiceMode === 'free' && voiceEnabled) {
                startCapture();
                showVoiceStatus(true, '🎤', '聆听中...（本地ASR）');
            }
        });
    }
}

function _requestMicPermission() {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        return navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            stream.getTracks().forEach(t => t.stop());
            return true;
        }).catch(err => {
            console.error('麦克风权限请求失败:', err.name, err.message);
            if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                alert('麦克风权限被拒绝。请按以下步骤操作：\n\n1. 点击浏览器地址栏左侧的 🔒 图标\n2. 找到"麦克风"，改为"允许"\n3. 刷新页面后重试');
            } else if (err.name === 'NotFoundError') {
                alert('未检测到麦克风设备。请检查：\n\n1. 是否连接了麦克风\n2. macOS 系统设置 → 隐私 → 麦克风 → 允许 Chrome');
            } else {
                alert(`麦克风访问失败 (${err.name})，请检查系统音频设置后重试`);
            }
            return false;
        });
    }
    alert('当前浏览器不支持麦克风访问，请使用 Chrome 或 Edge 浏览器');
    return Promise.resolve(false);
}

// ── Unified Local ASR ─────────────────────────────────────────
function warmupLocalASR(mode, onReady) {
    if (localASR.ready && localASR.mode === mode && localASR.ws && localASR.ws.readyState === WebSocket.OPEN) {
        if (onReady) onReady();
        return;
    }

    localASR.closing = false;
    localASR.mode = mode;
    localASR.captureActive = false;
    localASR.pendingText = '';

    _requestMicPermission().then(granted => {
        if (!granted || !voiceEnabled) { resetVoiceMode(); return; }
        _connectLocalASR(onReady);
    });
}

function _connectLocalASR(onReady) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            if (!voiceEnabled) { stream.getTracks().forEach(t => t.stop()); return; }

            localASR.stream = stream;
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            localASR.ws = new WebSocket(`${protocol}//${location.host}/api/asr`);

            localASR.ws.onopen = () => {
                if (!voiceEnabled) { _teardownLocalASR(); return; }
                localASR.ws.send(JSON.stringify({
                    chunk_size: [5, 10, 5],
                    wav_name: "h5",
                    is_speaking: true,
                    mode: "2pass",
                    itn: true,
                }));
                _setupAudioCapture(stream);
                localASR.ready = true;
                if (onReady) onReady();
            };

            localASR.ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.is_final) {
                        const text = (data.text || '').trim();

                        if (!text) {
                            console.log('[ASR] result: (empty), restarting...');
                            if (localASR.mode === 'free' && voiceEnabled && !voiceWaitingForReply) {
                                localASR.captureActive = false;
                                _restartAfterSilence();
                            }
                            return;
                        }

                        localASR.pendingText = text;
                        showVoiceTranscript(text, false);
                        console.log('[ASR] result:', text, '| mode:', localASR.mode, '| voiceWaitingForReply:', voiceWaitingForReply);

                        if (!isValidVoiceInput(text)) {
                            console.log('[ASR] rejected by isValidVoiceInput');
                            if (localASR.mode === 'free' && voiceEnabled && !voiceWaitingForReply) {
                                localASR.captureActive = false;
                                if (text.length < VOICE_TEXT_MIN_LENGTH) {
                                    _restartAfterSilence();
                                } else {
                                    console.log('[Echo] rejected, restarting listen immediately');
                                    setTimeout(() => _restartFreeListening(), 500);
                                }
                            }
                            return;
                        }

                        if (voiceWaitingForReply) {
                            console.log('[Echo] discard ASR result while waiting for reply');
                            if (localASR.mode === 'free') localASR.captureActive = false;
                            return;
                        }

                        if (localASR.mode === 'ptt') {
                            if (localASR.pendingResolve) {
                                localASR.pendingResolve(text);
                                localASR.pendingResolve = null;
                            }
                            return;
                        }

                        voiceLastFinalText = text;

                        if (localASR.pendingResolve) {
                            localASR.pendingResolve(text);
                            localASR.pendingResolve = null;
                        }

                        if (localASR.mode === 'free') {
                            localASR.captureActive = false;
                            sendVoiceText(text, true);
                        }
                    }
                } catch(e) { /* binary data — ignore */ }
            };

            localASR.ws.onerror = (err) => {
                console.error('本地ASR WebSocket错误:', err);
                if (!voiceEnabled) { resetVoiceMode(); return; }
                showVoiceStatus(true, '⚠️', 'ASR连接错误，尝试重连...');
                _teardownLocalASR();
                if (voiceMode === 'free' && voiceEnabled) {
                    setTimeout(() => {
                        if (voiceEnabled && voiceMode === 'free') { _restartFreeListening(); }
                    }, 1000);
                } else {
                    setTimeout(() => resetVoiceMode(), 2000);
                }
            };

            localASR.ws.onclose = () => {
                _teardownAudioCapture();
                localASR.ready = false;
                if (localASR.pendingResolve) {
                    localASR.pendingResolve('');
                    localASR.pendingResolve = null;
                }
                if (voiceEnabled && voiceMode === 'free' && !voiceWaitingForReply) {
                    setTimeout(() => {
                        if (voiceEnabled && voiceMode === 'free') { _restartFreeListening(); }
                    }, 500);
                }
            };
        }).catch(err => {
            console.error('获取麦克风失败:', err);
            resetVoiceMode();
        });
    } catch(e) {
        console.error('启动本地ASR失败:', e);
        resetVoiceMode();
    }
}

function _setupAudioCapture(stream) { localASR.stream = stream; }

function _ensureAudioContext() {
    if (localASR.audioCtx) return;
    if (!localASR.stream) return;
    try {
        const SAMPLE_RATE = 16000;
        localASR.audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
        localASR.source = localASR.audioCtx.createMediaStreamSource(localASR.stream);
        localASR.processor = localASR.audioCtx.createScriptProcessor(4096, 1, 1);
        localASR.source.connect(localASR.processor);
        const silentGain = localASR.audioCtx.createGain();
        silentGain.gain.value = 0;
        localASR.processor.connect(silentGain);
        silentGain.connect(localASR.audioCtx.destination);

        localASR.processor.onaudioprocess = (e) => {
            if (!localASR.captureActive) return;
            if (!localASR.ws || localASR.ws.readyState !== WebSocket.OPEN) return;
            const input = e.inputBuffer.getChannelData(0);

            let sum = 0;
            for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
            const rms = Math.sqrt(sum / input.length);
            const chunkMs = (input.length / localASR.audioCtx.sampleRate) * 1000;
            const cfg = localASR.vadConfig;

            if (rms > cfg.silenceThreshold) {
                localASR.vadSpeechDetected = true;
                localASR.vadSilenceMs = 0;
            } else {
                localASR.vadSilenceMs += chunkMs;
            }

            const elapsedMs = Date.now() - localASR.vadStartTime;

            if (localASR.mode !== 'ptt') {
                if ((localASR.vadSpeechDetected && localASR.vadSilenceMs >= cfg.silenceDurationMs && elapsedMs >= cfg.minSpeechMs) ||
                    elapsedMs >= cfg.maxCaptureMs) {
                    localASR.captureActive = false;
                    stopCapture();
                    return;
                }
            } else if (elapsedMs >= cfg.maxCaptureMs) {
                localASR.captureActive = false;
                stopCapture();
                return;
            }

            const pcm16 = new Int16Array(input.length);
            for (let i = 0; i < input.length; i++) {
                pcm16[i] = Math.max(-32768, Math.min(32767, Math.round(input[i] * 32768)));
            }
            localASR.ws.send(pcm16.buffer);
        };
    } catch(e) { console.error('音频上下文创建失败:', e); }
}

function _teardownAudioCapture() {
    if (localASR.processor) { localASR.processor.disconnect(); localASR.processor = null; }
    if (localASR.source) { localASR.source.disconnect(); localASR.source = null; }
    if (localASR.audioCtx) { localASR.audioCtx.close().catch(() => {}); localASR.audioCtx = null; }
    if (localASR.stream) { localASR.stream.getTracks().forEach(t => t.stop()); localASR.stream = null; }
}

function _teardownLocalASR() {
    if (localASR.closing) return;
    localASR.closing = true;
    localASR.captureActive = false;
    if (localASR.ws) { try { localASR.ws.close(); } catch(e) {} localASR.ws = null; }
    _teardownAudioCapture();
    localASR.ready = false;
    localASR.mode = null;
    setTimeout(() => { localASR.closing = false; }, 100);
}

function _resumeASRSession() {
    if (localASR.ws && localASR.ws.readyState === WebSocket.OPEN) {
        try { localASR.ws.send(JSON.stringify({ chunk_size: [5, 10, 5], wav_name: "h5", is_speaking: true, mode: "2pass", itn: true })); } catch(e) {}
    }
}

function startCapture() {
    if (!localASR.ready || !localASR.ws || localASR.ws.readyState !== WebSocket.OPEN) return;
    if (!localASR.stream) return;

    _ensureAudioContext();
    localASR.captureActive = true;
    localASR.vadSilenceMs = 0;
    localASR.vadSpeechDetected = false;
    localASR.vadStartTime = Date.now();

    const doStart = () => { _resumeASRSession(); };

    if (localASR.audioCtx && localASR.audioCtx.state === 'suspended') {
        localASR.audioCtx.resume().then(doStart).catch(e => {
            console.error('AudioContext resume failed:', e);
            localASR.captureActive = false;
            showVoiceStatus(true, '⚠️', '请点击页面后重试');
            const retry = () => {
                document.removeEventListener('click', retry);
                if (localASR.audioCtx && localASR.audioCtx.state === 'suspended') {
                    localASR.audioCtx.resume().then(() => {
                        if (voiceMode !== 'off' && voiceEnabled) startCapture();
                    }).catch(() => {});
                }
            };
            document.addEventListener('click', retry);
        });
    } else {
        doStart();
    }
}

function stopCapture() {
    localASR.captureActive = false;
    if (localASR.ws && localASR.ws.readyState === WebSocket.OPEN) {
        try { localASR.ws.send(JSON.stringify({ is_speaking: false })); } catch(e) {}
    }
}

// ── Push-to-Talk ──────────────────────────────────────────────
let _pttActive = false;

function pttStart() {
    if (!sessionid) return;
    _pttActive = true;

    document.getElementById('pttButton').className = 'btn-danger-custom w-100 py-3 fs-5';
    if (typeof btnDangerCustomStyle === 'undefined') {
        document.getElementById('pttButton').style.background = 'linear-gradient(135deg, #e63946, #c1121f)';
        document.getElementById('pttButton').style.color = '#fff';
        document.getElementById('pttButton').style.border = 'none';
    }
    document.getElementById('pttButton').textContent = '✋ 松开发送';

    const fsPttBtn = document.getElementById('fsPttButton');
    if (fsPttBtn) { fsPttBtn.className = 'btn btn-danger w-100 py-2'; fsPttBtn.textContent = '✋ 松开发送'; }

    const mainPtt = document.getElementById('btnPtt');
    if (mainPtt) { mainPtt.classList.add('ptt-hold'); mainPtt.textContent = '✋'; }

    const fsPtt = document.getElementById('fsBtnPtt');
    if (fsPtt) { fsPtt.classList.add('ptt-hold'); fsPtt.textContent = '✋'; }

    _clearVoiceWaiting();
    voiceLastFinalText = '';
    voiceLastSentText = '';
    localASR.pendingText = '';
    _avatarRecentTexts = [];

    console.log('[PTT] start');
    fetch('/interrupt_talk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionid: String(sessionid) }),
    }).catch(() => {});

    _startPTTLocal();
}

function _startPTTLocal() {
    if (localASR.ready && localASR.ws && localASR.ws.readyState === WebSocket.OPEN) {
        localASR.mode = 'ptt';
        startCapture();
        showVoiceStatus(true, '🎤', '请说话...');
        return;
    }
    showVoiceStatus(true, '⏳', '启动本地语音识别...');
    warmupLocalASR('ptt', () => {
        if (localASR.ready && voiceEnabled) {
            startCapture();
            showVoiceStatus(true, '🎤', '请说话...');
        }
    });
}

function pttEnd() {
    if (!_pttActive) return;
    _pttActive = false;

    document.getElementById('pttButton').className = 'btn-primary-custom w-100 py-3 fs-5';
    if (typeof btnPrimaryCustomStyle === 'undefined') {
        document.getElementById('pttButton').style.background = 'linear-gradient(135deg, #00b4d8, #0096c7)';
        document.getElementById('pttButton').style.color = '#fff';
        document.getElementById('pttButton').style.border = 'none';
    }
    document.getElementById('pttButton').textContent = '🎤 按住说话';

    const fsPttBtn = document.getElementById('fsPttButton');
    if (fsPttBtn) { fsPttBtn.className = 'btn btn-primary w-100 py-2'; fsPttBtn.textContent = '🎤 按住说话'; }

    const mainPtt = document.getElementById('btnPtt');
    if (mainPtt) { mainPtt.classList.remove('ptt-hold'); mainPtt.textContent = '🎤'; }

    const fsPtt = document.getElementById('fsBtnPtt');
    if (fsPtt) { fsPtt.classList.remove('ptt-hold'); fsPtt.textContent = '🎤'; }

    showVoiceStatus(true, '⏳', '处理中...');

    if (localASR.ready && localASR.ws && localASR.ws.readyState === WebSocket.OPEN) {
        stopCapture();
        new Promise((resolve) => {
            localASR.pendingResolve = resolve;
            setTimeout(() => {
                if (localASR.pendingResolve) {
                    console.log('[PTT] ASR result timeout, using pendingText:', localASR.pendingText);
                    localASR.pendingResolve(localASR.pendingText || '');
                    localASR.pendingResolve = null;
                }
            }, 5000);
        }).then(text => {
            if (text && isValidVoiceInput(text)) {
                showVoiceStatus(true, '📝', '识别完成');
                console.log('[PTT] sending:', text.substring(0, 50));
                sendVoiceText(text, false);
            } else {
                console.log('[PTT] no valid speech detected, text:', JSON.stringify(text));
                showVoiceStatus(true, '⏳', '未检测到语音');
                setTimeout(() => showVoiceStatus(false), 1500);
            }
        });
        return;
    }
    showVoiceStatus(false);
}

document.addEventListener('mouseup', () => { if (_pttActive) pttEnd(); });
document.addEventListener('touchend', () => { if (_pttActive) pttEnd(); });
document.addEventListener('touchcancel', () => { if (_pttActive) pttEnd(); });

// ── Shared Voice Functions ────────────────────────────────────
function isValidVoiceInput(text) {
    if (!text || text.length < VOICE_TEXT_MIN_LENGTH) return false;
    if (text === voiceLastFinalText) return false;
    if (text === voiceLastSentText) { console.log('[Echo Reject] matches last sent:', text); return false; }
    if (voiceLastSentText && isTextSimilar(text, voiceLastSentText)) { console.log('[Echo Reject] similar to last sent:', text); return false; }
    for (const avatarText of _avatarRecentTexts) {
        if (isTextSimilar(text, avatarText)) { console.log('[Echo Reject] matches avatar speech:', text, '~', avatarText.substring(0, 30)); return false; }
    }
    return true;
}

function isTextSimilar(a, b) {
    if (!a || !b) return false;
    const aWords = a.toLowerCase().replace(/[^\w一-鿿]/g, ' ').split(/\s+/).filter(Boolean);
    const bWords = b.toLowerCase().replace(/[^\w一-鿿]/g, ' ').split(/\s+/).filter(Boolean);
    if (aWords.length < 2 || bWords.length < 2) return false;
    const short = aWords.length <= bWords.length ? aWords : bWords;
    const long = aWords.length > bWords.length ? aWords : bWords;
    const match = short.filter(w => long.includes(w)).length;
    return match / short.length >= 0.7;
}

function startVoiceCooldown() {
    if (voiceCooldownTimer) { clearTimeout(voiceCooldownTimer); voiceCooldownTimer = null; }
    const jitter = VOICE_ECHO_COOLDOWN_MS * (0.8 + Math.random() * 0.4);
    voiceCooldownTimer = setTimeout(() => {
        voiceCooldownTimer = null;
        if (voiceMode === 'free' && voiceEnabled && !voiceWaitingForReply) { _restartFreeListening(); }
    }, jitter);
    showVoiceStatus(true, '🔇', '冷却中...');
}

function _restartFreeListening() {
    if (!voiceEnabled || voiceWaitingForReply) return;
    if (localASR.captureActive) return;
    if (_avatarSpeaking) { console.log('[Voice] blocked: avatar still speaking'); setTimeout(() => _restartFreeListening(), 1000); return; }
    const sinceSpeak = Date.now() - _avatarSpeakEndTime;
    if (_avatarSpeakEndTime > 0 && sinceSpeak < VOICE_ECHO_COOLDOWN_MS) {
        const remain = VOICE_ECHO_COOLDOWN_MS - sinceSpeak;
        console.log('[Voice] echo cooldown,', Math.ceil(remain / 1000), 's remaining');
        setTimeout(() => _restartFreeListening(), remain);
        return;
    }
    if (localASR.ready && localASR.ws && localASR.ws.readyState === WebSocket.OPEN) {
        showVoiceStatus(true, '🎤', '聆听中...');
        startCapture();
        return;
    }
    showVoiceStatus(true, '🎤', '聆听中...（重新连接）');
    warmupLocalASR('free', () => {
        if (voiceMode === 'free' && voiceEnabled && !voiceWaitingForReply) startCapture();
    });
}

let _silenceRestartTimer = null;
function _restartAfterSilence() {
    if (!voiceEnabled || voiceMode !== 'free' || voiceWaitingForReply) return;
    if (_silenceRestartTimer) return;
    _silenceRestartTimer = setTimeout(() => {
        _silenceRestartTimer = null;
        if (voiceEnabled && voiceMode === 'free' && !voiceWaitingForReply) { _restartFreeListening(); }
    }, 500);
}

function sendVoiceText(text, interrupt) {
    if (!text || !sessionid) { console.warn('[Voice] sendVoiceText blocked:', { text: !!text, sessionid }); return; }
    voiceWaitingForReply = true;
    voiceLastSentText = text;
    voiceLastFinalText = text;
    console.log('[Voice] sendVoiceText:', text.substring(0, 50));
    showVoiceStatus(true, '⏳', '处理中...');
    appendVoiceChatLog('user', text);
    showVoiceTranscript('', false);

    if (voiceWaitingTimeout) clearTimeout(voiceWaitingTimeout);
    voiceWaitingTimeout = setTimeout(() => {
        if (voiceWaitingForReply) {
            console.warn('[Voice] Total reply timeout — recovering');
            _clearVoiceWaiting();
            appendVoiceChatLog('avatar', '(回复超时)');
            if (voiceMode === 'free' && voiceEnabled) _restartFreeListening();
        }
    }, VOICE_WAITING_MAX_MS);

    const type = document.getElementById('txtType').value;
    const ttsModel = document.getElementById('ttsModel').value;
    const ttsVoice = document.getElementById('ttsVoice').value;
    const body = { text, type, interrupt, sessionid: String(sessionid) };
    body.tts = { model: ttsModel, ref_file: ttsVoice };

    fetch('/human', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    }).then(r => r.json()).then(d => {
        console.log('[Voice] /human response:', d);
        if (d.code !== 0) {
            console.error('voice send error:', d);
            _clearVoiceWaiting();
            if (voiceMode === 'free' && voiceEnabled) startVoiceCooldown();
            return;
        }
        if (voiceMode === 'free') pollSpeakingEnd();
    }).catch(e => {
        console.error('voice send error:', e);
        _clearVoiceWaiting();
        if (voiceMode === 'free' && voiceEnabled) startVoiceCooldown();
    });
}

function _clearVoiceWaiting() {
    voiceWaitingForReply = false;
    if (voiceWaitingTimeout) { clearTimeout(voiceWaitingTimeout); voiceWaitingTimeout = null; }
    if (voicePollTimer) { clearInterval(voicePollTimer); voicePollTimer = null; }
}

function pollSpeakingEnd() {
    if (!voiceEnabled || !sessionid) return;
    showVoiceStatus(true, '🔊', '说话中...');
    const pollStartTime = Date.now();
    let avatarEverSpoke = false;

    voicePollTimer = setInterval(() => {
        if (!voiceEnabled || !sessionid) { _clearVoiceWaiting(); return; }
        fetch('/is_speaking', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionid: String(sessionid) }),
        }).then(r => r.json()).then(d => {
            const speaking = typeof d.data === 'boolean' ? d.data : (d.data && d.data.speaking);
            const llmPending = d.data && typeof d.data === 'object' && d.data.llm_pending;

            if (d.data && d.data.recent_texts) { _avatarRecentTexts = d.data.recent_texts; }

            if (speaking) { avatarEverSpoke = true; _avatarSpeaking = true; }

            if (!speaking) {
                if (_avatarSpeaking) { _avatarSpeaking = false; _avatarSpeakEndTime = Date.now(); }
                if (avatarEverSpoke) {
                    _clearVoiceWaiting();
                    voiceRestartCount = 0;
                    appendVoiceChatLog('avatar', '(回复完成)');
                    if (voiceMode === 'free' && voiceEnabled) startVoiceCooldown();
                } else if (!llmPending && Date.now() - pollStartTime > VOICE_WAITING_START_MS) {
                    console.warn('[Voice] LLM done but avatar never spoke');
                    _clearVoiceWaiting();
                    appendVoiceChatLog('avatar', '(未收到回复)');
                    if (voiceMode === 'free' && voiceEnabled) _restartFreeListening();
                }
            }
        }).catch(() => {});
    }, 500);
}

function showVoiceStatus(show, icon, text) {
    const bar = document.getElementById('voiceStatusBar');
    const iconEl = document.getElementById('voiceStatusIcon');
    const textEl = document.getElementById('voiceStatusText');
    if (show) { bar.style.display = 'block'; iconEl.textContent = icon; textEl.textContent = text; }
    else { bar.style.display = 'none'; }
}

function showVoiceTranscript(text, interim) {
    const el = document.getElementById('voiceTranscript');
    if (!text) { el.style.display = 'none'; el.textContent = ''; return; }
    el.style.display = 'block';
    el.textContent = text;
    el.style.opacity = interim ? '0.6' : '1';
}

function appendVoiceChatLog(role, text) {
    const log = document.getElementById('voiceChatLog');
    const div = document.createElement('div');
    div.className = role === 'user' ? 'msg-user' : 'msg-avatar';
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

function stopVoiceMode() {
    voiceEnabled = false;
    voiceWaitingForReply = false;
    voiceRestartCount = 0;
    if (voiceRecognition) { try { voiceRecognition.stop(); } catch(e) {} voiceRecognition = null; }
    _teardownLocalASR();
    if (voiceCooldownTimer) { clearTimeout(voiceCooldownTimer); voiceCooldownTimer = null; }
    if (voiceWaitingTimeout) { clearTimeout(voiceWaitingTimeout); voiceWaitingTimeout = null; }
    if (_silenceRestartTimer) { clearTimeout(_silenceRestartTimer); _silenceRestartTimer = null; }
    if (voicePollTimer) { clearInterval(voicePollTimer); voicePollTimer = null; }
    showVoiceStatus(false);
}

const _origStop = stop;
stop = function() {
    try { if (voiceMode !== 'off') resetVoiceMode(); } catch(e) { console.error('voice cleanup error:', e); }
    _origStop();
};

// ═══════════════ Fullscreen ═══════════════════════════════════
const _wrapper = document.getElementById('videoFullscreenWrapper');
let _isFullscreen = false;

function toggleFullscreen() {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
        const req = _wrapper.requestFullscreen || _wrapper.webkitRequestFullscreen;
        if (req) req.call(_wrapper);
    }
}

document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);

function onFullscreenChange() {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    _isFullscreen = (fsEl === _wrapper);
    if (_isFullscreen) {
        try {
            const fsVoiceMode = document.getElementById('fsVoiceMode');
            const voiceModeEl = document.getElementById('voiceMode');
            if (fsVoiceMode && voiceModeEl) fsVoiceMode.value = voiceModeEl.value;
            const fsPtt = document.getElementById('fsPttContainer');
            if (fsPtt && voiceModeEl) { fsPtt.style.display = (voiceModeEl.value === 'ptt') ? 'block' : 'none'; }
            const fsTxtType = document.getElementById('fsTxtType');
            const txtTypeEl = document.getElementById('txtType');
            if (fsTxtType && txtTypeEl) fsTxtType.value = txtTypeEl.value;
            const fsTxtInt = document.getElementById('fsTxtInterrupt');
            const txtIntEl = document.getElementById('txtInterrupt');
            if (fsTxtInt && txtIntEl) fsTxtInt.checked = txtIntEl.checked;
            const fsTtsModel = document.getElementById('fsTtsModel');
            const ttsModelEl = document.getElementById('ttsModel');
            if (fsTtsModel && ttsModelEl) fsTtsModel.value = ttsModelEl.value;
            const fsTtsVoice = document.getElementById('fsTtsVoice');
            const ttsVoiceEl = document.getElementById('ttsVoice');
            if (fsTtsVoice && ttsVoiceEl) fsTtsVoice.value = ttsVoiceEl.value;
            const fsLog = document.getElementById('fsVoiceChatLog');
            const mainLog = document.getElementById('voiceChatLog');
            if (fsLog && mainLog) { fsLog.innerHTML = mainLog.innerHTML; fsLog.scrollTop = fsLog.scrollHeight; }
        } catch (e) { console.warn('[FullscreenSync] sync failed:', e); }
        _wrapper.classList.add('fs-panel-open');
        const toggleBtn = document.getElementById('fsPanelToggle');
        if (toggleBtn) toggleBtn.classList.add('active');
    } else {
        _wrapper.classList.remove('fs-panel-open');
        const toggleBtn = document.getElementById('fsPanelToggle');
        if (toggleBtn) toggleBtn.classList.remove('active');
    }
}

function toggleFsPanel() {
    const open = _wrapper.classList.toggle('fs-panel-open');
    document.getElementById('fsPanelToggle').classList.toggle('active', open);
}

function sendFsText() {

// ═══════════════ WebRTC Loading Overlay ══════════════════════
let _webrtcLoaded = false;

function setWebRTCStep(step, title, subtext, icon) {
    if (_webrtcLoaded && step < 4) return;
    const overlay = document.getElementById('videoLoadingOverlay');
    if (!overlay) return;
    overlay.style.display = 'flex';
    overlay.style.opacity = '1';
    overlay.style.visibility = 'visible';

    if (title) document.getElementById('webrtcStepTitle').innerHTML = title;
    if (subtext) document.getElementById('webrtcStepSubtext').textContent = subtext;
    if (icon) document.getElementById('loadingIcon').className = 'bi ' + icon;

    for (let i = 1; i <= 4; i++) {
        const dot = document.getElementById('cdot' + i);
        if (!dot) continue;
        dot.classList.remove('active', 'done');
        if (i < step) dot.classList.add('done');
        else if (i === step) dot.classList.add('active');
    }
}

function hideWebRTCStep() {
    _webrtcLoaded = true;
    const overlay = document.getElementById('videoLoadingOverlay');
    if (!overlay) return;
    setWebRTCStep(4, '数字人连线就绪！', '正在呈现画面...', 'bi-check-lg');
    setTimeout(() => {
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; overlay.style.visibility = 'hidden'; }, 300);
    }, 200);
}

document.addEventListener('DOMContentLoaded', () => {
    const v = document.getElementById('video');
    if (v) {
        v.addEventListener('playing', hideWebRTCStep);
        v.addEventListener('timeupdate', () => { if (v.currentTime > 0.1 && !_webrtcLoaded) hideWebRTCStep(); });
    }
});

// ═══════════════ Chat UI ════════════════════════════════════
function sendChatText() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    if (!sessionid) { showChatStatus('⚠️', '请先连接 WebRTC'); return; }
    appendChatBubble('user', text);
    input.value = ''; autoResizeChatInput(input);
    const type = document.getElementById('txtType').value;
    const ttsModel = document.getElementById('ttsModel').value;
    const ttsVoice = document.getElementById('ttsVoice').value;
    showChatStatus('⏳', '发送中...');
    fetch('/human', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, type, interrupt: true, sessionid: String(sessionid),
            tts: { model: ttsModel, ref_file: ttsVoice } }),
    }).then(r => r.json()).then(d => {
        if (d.code !== 0) { showChatStatus('⚠️', '发送失败'); setTimeout(() => hideChatStatus(), 2000); return; }
        showChatStatus('🔊', '数字人回复中...');
        pollChatSpeakEnd();
    }).catch(() => { showChatStatus('⚠️', '网络错误'); setTimeout(() => hideChatStatus(), 2000); });
}

let _chatPollTimer = null;
function pollChatSpeakEnd() {
    if (_chatPollTimer) clearInterval(_chatPollTimer);
    let avatarEverSpoke = false;
    const startTime = Date.now();
    _chatPollTimer = setInterval(() => {
        if (!sessionid) { clearInterval(_chatPollTimer); return; }
        fetch('/is_speaking', { method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ sessionid: String(sessionid) }) })
        .then(r => r.json()).then(d => {
            const speaking = typeof d.data === 'boolean' ? d.data : (d.data && d.data.speaking);
            const llmPending = d.data && typeof d.data === 'object' && d.data.llm_pending;
            if (d.data && d.data.recent_texts) _avatarRecentTexts = d.data.recent_texts;
            if (speaking) { avatarEverSpoke = true; _avatarSpeaking = true; }
            if (!speaking) {
                if (_avatarSpeaking) { _avatarSpeaking = false; _avatarSpeakEndTime = Date.now(); }
                if (avatarEverSpoke) { clearInterval(_chatPollTimer); hideChatStatus(); appendChatBubble('avatar', '✅ 回复完成'); }
                else if (!llmPending && Date.now() - startTime > 15000) { clearInterval(_chatPollTimer); hideChatStatus(); appendChatBubble('avatar', '⚠️ 未收到回复'); }
            }
        }).catch(() => {});
    }, 500);
}

function _appendBubbleTo(container, role, text, opts) {
    if (!container) return;
    if (role === 'system') {
        const row = document.createElement('div'); row.className = 'bubble-system-row';
        const sp = document.createElement('span'); sp.className = 'bubble-system'; sp.textContent = text;
        row.appendChild(sp); container.appendChild(row); container.scrollTop = container.scrollHeight; return;
    }
    const row = document.createElement('div');
    row.className = 'bubble-row ' + role;
    if (opts.interim) row.dataset.interim = '1';
    const icon = document.createElement('div');
    icon.className = role === 'user' ? 'bubble-user-icon' : 'bubble-avatar-icon';
    icon.textContent = role === 'user' ? '🧑' : '🤖';
    const wrap = document.createElement('div');
    wrap.className = 'bubble-content';
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (opts.interim ? ' bubble-interim' : '');
    bubble.textContent = text;
    const ts = document.createElement('div');
    ts.className = 'bubble-timestamp';
    ts.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    wrap.appendChild(bubble); wrap.appendChild(ts);
    row.appendChild(icon); row.appendChild(wrap);
    container.appendChild(row); container.scrollTop = container.scrollHeight;
    return row;
}

function appendChatBubble(role, text, opts) {
    opts = opts || {};
    _appendBubbleTo(document.getElementById('chatMessages'), role, text, opts);
    _appendBubbleTo(document.getElementById('fsChatMessages'), role, text, opts);
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showChatStatus(icon, text) {
    const row = document.getElementById('chatStatusRow');
    const pill = document.getElementById('chatStatusPill');
    if (row && pill) { pill.innerHTML = '<span>' + icon + '</span>' + escapeHtml(text); row.style.display = 'flex'; }
    const fsRow = document.getElementById('fsChatStatusRow');
    const fsPill = document.getElementById('fsChatStatusPill');
    if (fsRow && fsPill) { fsPill.innerHTML = '<span>' + icon + '</span>' + escapeHtml(text); fsRow.style.display = 'flex'; }
}

function hideChatStatus() {
    const row = document.getElementById('chatStatusRow');
    if (row) row.style.display = 'none';
    const fsRow = document.getElementById('fsChatStatusRow');
    if (fsRow) fsRow.style.display = 'none';
}

function autoResizeChatInput(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 90) + 'px';
}

function onChatInputKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatText(); }
}

function onFsChatInputKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFsChatText(); }
}

function sendFsChatText() {
    const input = document.getElementById('fsChatInput');
    const text = input.value.trim();
    if (!text) return;
    const mainInput = document.getElementById('chatInput');
    if (mainInput) { mainInput.value = text; autoResizeChatInput(mainInput); }
    input.value = ''; autoResizeChatInput(input);
    sendChatText();
}

// ═══════════════ Mic Buttons ═════════════════════════════════
function toggleFreeMode() {
    const vmSel = document.getElementById('voiceMode');
    if (!sessionid) { alert('请先连接 WebRTC'); return; }
    if (vmSel.value === 'free') {
        vmSel.value = 'off'; onVoiceModeChange();
    } else {
        if (vmSel.value !== 'off') { vmSel.value = 'off'; onVoiceModeChange(); }
        _avatarRecentTexts = [];
        voiceLastFinalText = '';
        voiceLastSentText = '';
        vmSel.value = 'free'; onVoiceModeChange();
        showChatStatus('🎙️', '聆听中...');
    }
    syncMicButtons();
}

function syncMicButtons() {
    const isFree = document.getElementById('voiceMode').value === 'free';
    const freeBtn = document.getElementById('btnFree');
    if (freeBtn) freeBtn.classList.toggle('free-active', isFree);
    const fsFreeBtn = document.getElementById('fsBtnFree');
    if (fsFreeBtn) fsFreeBtn.classList.toggle('free-active', isFree);
    const pttBtn = document.getElementById('btnPtt');
    if (pttBtn) pttBtn.classList.remove('ptt-hold');
    const fsPttBtn = document.getElementById('fsBtnPtt');
    if (fsPttBtn) fsPttBtn.classList.remove('ptt-hold');
}

// ═══════════════ Bridge: voice → chat bubbles ═══════════════
const _orig2ShowVoiceStatus = showVoiceStatus;
showVoiceStatus = function(show, icon, text) {
    _orig2ShowVoiceStatus(show, icon, text);
    if (show) { showChatStatus(icon, text); } else { hideChatStatus(); }
    syncMicButtons();
    const pttBtn = document.getElementById('btnPtt');
    if (pttBtn) {
        if (show && icon === '🎤' && document.getElementById('voiceMode').value === 'ptt') {
            pttBtn.classList.add('ptt-hold');
        } else if (!show || document.getElementById('voiceMode').value !== 'ptt') {
            pttBtn.classList.remove('ptt-hold');
        }
    }
};

const _orig2ShowVoiceTranscript = showVoiceTranscript;
showVoiceTranscript = function(text, interim) {
    _orig2ShowVoiceTranscript(text, interim);
    const chatInput = document.getElementById('chatInput');
    if (!chatInput) return;
    if (interim && text) {
        chatInput.placeholder = '🎤 ' + text + '...';
    } else {
        chatInput.placeholder = '输入文本发送 / 按住🎤说话 / 点击🎙️自由对话…';
        if (!interim && text) { chatInput.value = text; autoResizeChatInput(chatInput); }
        else if (!interim && !text && chatInput.value) { chatInput.value = ''; autoResizeChatInput(chatInput); }
    }
};

const _orig2AppendVoiceChatLog = appendVoiceChatLog;
appendVoiceChatLog = function(role, text) {
    _orig2AppendVoiceChatLog(role, text);
    appendChatBubble(role === 'user' ? 'user' : 'avatar', text);
};

// ── Initialize ────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('btnStart').style.display = 'inline-flex';
});
</script>
