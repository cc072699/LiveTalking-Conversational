// ─── Voice Interaction (Free + Push-to-Talk) ─────────────────
// State
let voiceMode = 'off';
let voiceRecognition = null;
let voiceEnabled = false;
let voicePollTimer = null;
let voiceLastFinalText = '';
let voiceWaitingForReply = false;
let voiceRestartCount = 0;
let voiceCooldownTimer = null;
let voiceLastSentText = '';
let voiceWaitingTimeout = null;
const VOICE_WAITING_MAX_MS = 60000;   // Max total waiting time for reply
const VOICE_WAITING_START_MS = 10000; // Max time before avatar starts speaking

// Unified local ASR state
let localASR = {
    ws: null,
    stream: null,
    audioCtx: null,
    source: null,
    processor: null,
    captureActive: false,    // true = sending audio frames to WebSocket
    mode: null,              // 'free' or 'ptt'
    pendingResolve: null,    // Promise resolve for pending result
    pendingText: '',         // Accumulated result text
    ready: false,            // true = WebSocket + mic are ready
    closing: false,          // Prevent re-entrant close
    // VAD state
    vadSilenceMs: 0,
    vadSpeechDetected: false,
    vadStartTime: 0,
    vadConfig: {
        silenceThreshold: 0.01,   // RMS amplitude below this = silence
        silenceDurationMs: 1500,  // 1.5s silence after speech → trigger ASR
        minSpeechMs: 300,         // ignore speech shorter than 300ms (noise)
        maxCaptureMs: 30000,      // safety limit: 30s max capture
    },
};

const VOICE_MAX_RESTART = 3;
const VOICE_ECHO_COOLDOWN_MS = 2000;   // 安全兜底冷却（回声检测成功时不受此限制）
const VOICE_TEXT_MIN_LENGTH = 3;
let _avatarSpeaking = false;           // 数字人是否正在说话
let _avatarSpeakEndTime = 0;           // 数字人停止说话的时间戳
let _avatarRecentTexts = [];           // 数字人最近说的话（用于回声检测）
const AVATAR_TEXT_HISTORY_MAX = 10;    // 最多记住最近 N 句

// ─── Voice Mode Switch ──────────────────────────────────────
function onVoiceModeChange() {
    const newMode = document.getElementById('voiceMode').value;
    if (newMode === voiceMode) return;

    stopVoiceMode();
    voiceMode = newMode;
    document.getElementById('pttContainer').style.display = (newMode === 'ptt') ? 'block' : 'none';

    if (newMode === 'off') return;
    if (!sessionid) { alert('请先连接 WebRTC'); resetVoiceMode(); return; }

    const hasSpeechRecog = 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;

    voiceEnabled = true;

    if (newMode === 'free') {
        showVoiceStatus(true, '🎤', '启动中...');
        if (hasSpeechRecog) {
            startFreeRecognition();
        } else {
            warmupLocalASR('free', () => {
                if (voiceMode === 'free' && voiceEnabled) {
                    startCapture();
                    showVoiceStatus(true, '🎤', '聆听中...');
                }
            });
        }
    } else if (newMode === 'ptt') {
        showVoiceStatus(true, '⏳', '准备麦克风...');
        warmupLocalASR('ptt', () => {
            if (voiceMode === 'ptt') {
                showVoiceStatus(false);
            }
        });
    }

    // Sync fullscreen overlay voice mode
    const fsVm = document.getElementById('fsVoiceMode');
    if (fsVm) { fsVm.value = newMode; }
    const fsPttC = document.getElementById('fsPttContainer');
    if (fsPttC) { fsPttC.style.display = (newMode === 'ptt') ? 'block' : 'none'; }
}

function resetVoiceMode() {
    stopVoiceMode();
    voiceMode = 'off';
    document.getElementById('voiceMode').value = 'off';
    document.getElementById('pttContainer').style.display = 'none';
}

// ─── Free Conversation Mode ──────────────────────────────────
function startFreeRecognition() {
    if (!voiceEnabled || voiceWaitingForReply) return;

    try {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        voiceRecognition = new SpeechRecognition();
        voiceRecognition.continuous = true;
        voiceRecognition.interimResults = true;
        voiceRecognition.lang = 'zh-CN';

        voiceRecognition.onresult = function(event) {
            let finalText = '';
            let interimText = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalText += event.results[i][0].transcript;
                } else {
                    interimText += event.results[i][0].transcript;
                }
            }

            if (interimText) {
                showVoiceTranscript(finalText || interimText, true);
                showVoiceStatus(true, '📝', '识别中...');
            }

            if (finalText) {
                const text = finalText.trim();
                showVoiceTranscript(text, false);

                // Echo/noise rejection
                if (!isValidVoiceInput(text)) return;
                voiceLastFinalText = text;

                // Stop recognition while processing
                if (voiceRecognition) {
                    try { voiceRecognition.stop(); } catch(e) {}
                    voiceRecognition = null;
                }

                if (voiceWaitingForReply) {
                    showVoiceStatus(true, '⏳', '打断中...');
                    fetch('/interrupt_talk', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionid: String(sessionid) }),
                    }).then(() => sendVoiceText(text, true))
                      .catch(() => sendVoiceText(text, true));
                } else {
                    sendVoiceText(text, true);
                }
            }
        };

        voiceRecognition.onerror = function(event) {
            console.error('语音识别错误:', event.error);
            if (event.error === 'aborted') return;

            if (event.error === 'audio-capture' || event.error === 'no-speech') {
                showVoiceStatus(true, '⚠️', event.error === 'audio-capture' ? '未检测到麦克风' : '语音识别不可用');
                setTimeout(() => resetVoiceMode(), 2000);
                return;
            }

            // Google service blocked (common in China) → fallback to local ASR
            if (event.error === 'network') {
                console.log('SpeechRecognition network error, falling back to local ASR');
                showVoiceStatus(true, '🔄', '切换到本地语音识别...');
                if (voiceRecognition) {
                    try { voiceRecognition.stop(); } catch(e) {}
                    voiceRecognition = null;
                }
                warmupLocalASR('free', () => {
                    if (voiceMode === 'free' && voiceEnabled) {
                        startCapture();
                        showVoiceStatus(true, '🎤', '聆听中...（本地ASR）');
                    }
                });
                return;
            }

            if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                showVoiceStatus(true, '⏳', '请求麦克风权限...');
                voiceRecognition = null;
                _requestMicPermission().then(granted => {
                    if (granted && voiceEnabled && !voiceWaitingForReply && !voiceCooldownTimer) {
                        startFreeRecognition();
                    }
                });
                return;
            }

            if (voiceEnabled && !voiceWaitingForReply) {
                voiceRestartCount++;
                if (voiceRestartCount <= VOICE_MAX_RESTART) {
                    setTimeout(() => startFreeRecognition(), 500);
                } else {
                    showVoiceStatus(true, '⚠️', '识别异常');
                    setTimeout(() => resetVoiceMode(), 2000);
                }
            }
        };

        voiceRecognition.onend = function() {
            if (voiceEnabled && !voiceWaitingForReply && !voiceCooldownTimer) {
                startFreeRecognition();
            }
        };

        voiceRecognition.start();
    } catch (e) {
        console.error('启动语音识别失败:', e);
        // Fallback to local ASR
        warmupLocalASR('free', () => {
            if (voiceMode === 'free' && voiceEnabled) {
                startCapture();
                showVoiceStatus(true, '🎤', '聆听中...（本地ASR）');
            }
        });
    }
}

// ─── Microphone Permission ───────────────────────────────────
function _requestMicPermission() {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        return navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            stream.getTracks().forEach(t => t.stop());
            return true;
        }).catch(err => {
            console.error('麦克风权限请求失败:', err.name, err.message);
            if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                alert('麦克风权限被拒绝。请按以下步骤操作：\n\n1. 点击浏览器地址栏左侧的 🔒 图标\n2. 找到"麦克风"，改为"允许"\n3. 刷新页面后重试');
            } else if (err.name === 'NotFoundError') {
                alert('未检测到麦克风设备。请检查：\n\n1. 是否连接了麦克风\n2. macOS 系统设置 → 隐私 → 麦克风 → 允许 Chrome');
            } else {
                alert(`麦克风访问失败 (${err.name})，请检查系统音频设置后重试`);
            }
            return false;
        });
    }
    alert('当前浏览器不支持麦克风访问，请使用 Chrome 或 Edge 浏览器');
    return Promise.resolve(false);
}
// ─── Unified Local ASR ──────────────────────────────────────
function warmupLocalASR(mode, onReady) {
    if (localASR.ready && localASR.mode === mode && localASR.ws && localASR.ws.readyState === WebSocket.OPEN) {
        if (onReady) onReady();
        return;
    }

    localASR.closing = false;
    localASR.mode = mode;
    localASR.captureActive = false;
    localASR.pendingText = '';

    _requestMicPermission().then(granted => {
        if (!granted || !voiceEnabled) { resetVoiceMode(); return; }
        _connectLocalASR(onReady);
    });
}

function _connectLocalASR(onReady) {
    try {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            if (!voiceEnabled) { stream.getTracks().forEach(t => t.stop()); return; }

            localASR.stream = stream;
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            localASR.ws = new WebSocket(`${protocol}//${location.host}/api/asr`);

            localASR.ws.onopen = () => {
                if (!voiceEnabled) { _teardownLocalASR(); return; }
                localASR.ws.send(JSON.stringify({
                    chunk_size: [5, 10, 5],
                    wav_name: "h5",
                    is_speaking: true,
                    mode: "2pass",
                    itn: true,
                }));
                _setupAudioCapture(stream);
                localASR.ready = true;
                if (onReady) onReady();
            };

            localASR.ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.is_final) {
                        const text = (data.text || '').trim();

                        // ASR 返回空文本：VAD 检测到的不是有效语音，重启监听
                        if (!text) {
                            console.log('[ASR] result: (empty), restarting...');
                            if (localASR.mode === 'free' && voiceEnabled && !voiceWaitingForReply) {
                                localASR.captureActive = false;
                                _restartAfterSilence();
                            }
                            return;
                        }

                        localASR.pendingText = text;
                        showVoiceTranscript(text, false);
                        console.log('[ASR] result:', text, '| mode:', localASR.mode, '| voiceWaitingForReply:', voiceWaitingForReply);

                        if (!isValidVoiceInput(text)) {
                            console.log('[ASR] rejected by isValidVoiceInput');
                            if (localASR.mode === 'free' && voiceEnabled && !voiceWaitingForReply) {
                                // Pause capture. Debounced restart prevents infinite loop
                                // when VAD triggers on silence → ASR returns empty → restart.
                                localASR.captureActive = false;
                                if (text.length < VOICE_TEXT_MIN_LENGTH) {
                                    _restartAfterSilence();
                                } else {
                                    // 回声被拒绝：立即重新开始监听（不等冷却）
                                    console.log('[Echo] rejected, restarting listen immediately');
                                    setTimeout(() => _restartFreeListening(), 500);
                                }
                            }
                            return;
                        }

                        // CRITICAL: discard if waiting for reply (echo protection)
                        if (voiceWaitingForReply) {
                            console.log('[Echo] discard ASR result while waiting for reply');
                            if (localASR.mode === 'free') localASR.captureActive = false;
                            return;
                        }

                        // PTT 模式：ASR 结果可能在 pttEnd() 之前到达
                        // 先存到 pendingText，不设 voiceLastFinalText（避免 pttEnd 重复检测误杀）
                        // 如果 pendingResolve 已设置（pttEnd 先于 ASR 结果），直接 resolve
                        if (localASR.mode === 'ptt') {
                            if (localASR.pendingResolve) {
                                localASR.pendingResolve(text);
                                localASR.pendingResolve = null;
                            }
                            // 不设 voiceLastFinalText，等 sendVoiceText 统一设置
                            return;
                        }

                        voiceLastFinalText = text;

                        // Resolve pending PTT promise (fallback, should not normally reach here)
                        if (localASR.pendingResolve) {
                            localASR.pendingResolve(text);
                            localASR.pendingResolve = null;
                        }

                        // Free mode: pause capture, keep connection alive for next turn
                        if (localASR.mode === 'free') {
                            localASR.captureActive = false;
                            sendVoiceText(text, true);
                        }
                    }
                } catch(e) { /* binary data — ignore */ }
            };

            localASR.ws.onerror = (err) => {
                console.error('本地ASR WebSocket错误:', err);
                if (!voiceEnabled) { resetVoiceMode(); return; }
                showVoiceStatus(true, '⚠️', 'ASR连接错误，尝试重连...');
                _teardownLocalASR();
                // In free mode, auto-reconnect instead of giving up
                if (voiceMode === 'free' && voiceEnabled) {
                    setTimeout(() => {
                        if (voiceEnabled && voiceMode === 'free') {
                            _restartFreeListening();
                        }
                    }, 1000);
                } else {
                    setTimeout(() => resetVoiceMode(), 2000);
                }
            };

            localASR.ws.onclose = () => {
                _teardownAudioCapture();
                localASR.ready = false;
                if (localASR.pendingResolve) {
                    localASR.pendingResolve('');
                    localASR.pendingResolve = null;
                }
                // Auto-restart in free mode if connection drops unexpectedly
                if (voiceEnabled && voiceMode === 'free' && !voiceWaitingForReply) {
                    setTimeout(() => {
                        if (voiceEnabled && voiceMode === 'free') {
                            _restartFreeListening();
                        }
                    }, 500);
                }
            };
        }).catch(err => {
            console.error('获取麦克风失败:', err);
            resetVoiceMode();
        });
    } catch(e) {
        console.error('启动本地ASR失败:', e);
        resetVoiceMode();
    }
}

function _setupAudioCapture(stream) {
    // Just store the stream for later. AudioContext is created in startCapture()
    // where we have a user gesture context (needed for AudioContext.resume()).
    localASR.stream = stream;
}

function _ensureAudioContext() {
    if (localASR.audioCtx) return;
    if (!localASR.stream) return;
    try {
        const SAMPLE_RATE = 16000;
        localASR.audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
        localASR.source = localASR.audioCtx.createMediaStreamSource(localASR.stream);
        localASR.processor = localASR.audioCtx.createScriptProcessor(4096, 1, 1);
        localASR.source.connect(localASR.processor);
        // ScriptProcessor must be connected to destination for onaudioprocess to fire.
        // Use a silent gain node to avoid playing mic audio through speakers.
        const silentGain = localASR.audioCtx.createGain();
        silentGain.gain.value = 0;
        localASR.processor.connect(silentGain);
        silentGain.connect(localASR.audioCtx.destination);

        localASR.processor.onaudioprocess = (e) => {
            if (!localASR.captureActive) return;
            if (!localASR.ws || localASR.ws.readyState !== WebSocket.OPEN) return;
            const input = e.inputBuffer.getChannelData(0);

            // ── VAD: compute RMS amplitude ──
            let sum = 0;
            for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
            const rms = Math.sqrt(sum / input.length);
            const chunkMs = (input.length / localASR.audioCtx.sampleRate) * 1000;
            const cfg = localASR.vadConfig;

            if (rms > cfg.silenceThreshold) {
                // Speech detected
                localASR.vadSpeechDetected = true;
                localASR.vadSilenceMs = 0;
            } else {
                // Silence
                localASR.vadSilenceMs += chunkMs;
            }

            const elapsedMs = Date.now() - localASR.vadStartTime;

            // In PTT mode, don't auto-stop — user controls stop via button release
            if (localASR.mode !== 'ptt') {
                // Free mode: auto-stop on silence after speech, or max capture time
                if ((localASR.vadSpeechDetected && localASR.vadSilenceMs >= cfg.silenceDurationMs && elapsedMs >= cfg.minSpeechMs) ||
                    elapsedMs >= cfg.maxCaptureMs) {
                    localASR.captureActive = false;
                    stopCapture();
                    return; // Don't send this trailing silence chunk
                }
            } else if (elapsedMs >= cfg.maxCaptureMs) {
                // PTT mode: only auto-stop at max capture limit (30s)
                localASR.captureActive = false;
                stopCapture();
                return;
            }

            // Send audio to ASR server
            const pcm16 = new Int16Array(input.length);
            for (let i = 0; i < input.length; i++) {
                pcm16[i] = Math.max(-32768, Math.min(32767, Math.round(input[i] * 32768)));
            }
            localASR.ws.send(pcm16.buffer);
        };
    } catch(e) { console.error('音频上下文创建失败:', e); }
}

function _teardownAudioCapture() {
    if (localASR.processor) { localASR.processor.disconnect(); localASR.processor = null; }
    if (localASR.source) { localASR.source.disconnect(); localASR.source = null; }
    if (localASR.audioCtx) { localASR.audioCtx.close().catch(() => {}); localASR.audioCtx = null; }
    if (localASR.stream) { localASR.stream.getTracks().forEach(t => t.stop()); localASR.stream = null; }
}

function _teardownLocalASR() {
    if (localASR.closing) return;
    localASR.closing = true;
    localASR.captureActive = false;
    if (localASR.ws) {
        try { localASR.ws.close(); } catch(e) {}
        localASR.ws = null;
    }
    _teardownAudioCapture();
    localASR.ready = false;
    localASR.mode = null;
    setTimeout(() => { localASR.closing = false; }, 100);
}

function _resumeASRSession() {
    if (localASR.ws && localASR.ws.readyState === WebSocket.OPEN) {
        try {
            localASR.ws.send(JSON.stringify({
                chunk_size: [5, 10, 5], wav_name: "h5",
                is_speaking: true, mode: "2pass", itn: true,
            }));
        } catch(e) {}
    }
}

function startCapture() {
    if (!localASR.ready || !localASR.ws || localASR.ws.readyState !== WebSocket.OPEN) return;
    if (!localASR.stream) return;

    // Create AudioContext on demand (needs user gesture for resume to work)
    _ensureAudioContext();
    localASR.captureActive = true;

    // Reset VAD state
    localASR.vadSilenceMs = 0;
    localASR.vadSpeechDetected = false;
    localASR.vadStartTime = Date.now();

    const doStart = () => {
        // Always start a fresh ASR session (server resets its buffer on each is_speaking:true)
        _resumeASRSession();
    };

    // Resume AudioContext (Chrome suspends it when created outside user gesture)
    if (localASR.audioCtx && localASR.audioCtx.state === 'suspended') {
        localASR.audioCtx.resume().then(doStart).catch(e => {
            console.error('AudioContext resume failed:', e);
            localASR.captureActive = false;
            showVoiceStatus(true, '⚠️', '请点击页面后重试');
            // One-time click listener to retry
            const retry = () => {
                document.removeEventListener('click', retry);
                if (localASR.audioCtx && localASR.audioCtx.state === 'suspended') {
                    localASR.audioCtx.resume().then(() => {
                        if (voiceMode !== 'off' && voiceEnabled) startCapture();
                    }).catch(() => {});
                }
            };
            document.addEventListener('click', retry);
        });
    } else {
        doStart();
    }
}

function stopCapture() {
    localASR.captureActive = false;
    if (localASR.ws && localASR.ws.readyState === WebSocket.OPEN) {
        try { localASR.ws.send(JSON.stringify({ is_speaking: false })); } catch(e) {}
    }
}

// ─── Push-to-Talk Mode ──────────────────────────────────────
let _pttActive = false;

function pttStart() {
    if (!sessionid) return;
    _pttActive = true;

    document.getElementById('pttButton').className = 'btn-danger-custom w-100 py-3 fs-5';
    document.getElementById('pttButton').textContent = '✋ 松开发送';

    // Sync fullscreen PTT button
    const fsPttBtn = document.getElementById('fsPttButton');
    if (fsPttBtn) { fsPttBtn.className = 'btn btn-danger w-100 py-2'; fsPttBtn.textContent = '✋ 松开发送'; }

    // Sync main chat panel PTT button
    const mainPtt = document.getElementById('btnPtt');
    if (mainPtt) { mainPtt.classList.add('ptt-hold'); mainPtt.textContent = '✋'; }

    // Clear any previous waiting state so new input is not discarded
    _clearVoiceWaiting();

    // 重置回声过滤状态，避免上次对话的文字阻止本次识别
    voiceLastFinalText = '';
    voiceLastSentText = '';
    localASR.pendingText = '';
    _avatarRecentTexts = [];

    console.log('[PTT] start');

    // Interrupt any ongoing avatar speech
    fetch('/interrupt_talk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionid: String(sessionid) }),
    }).catch(() => {});

    // Always use local ASR for PTT (pre-warmed, no Google SpeechRecognition issues)
    _startPTTLocal();
}

function _startPTTLocal() {
    if (localASR.ready && localASR.ws && localASR.ws.readyState === WebSocket.OPEN) {
        localASR.mode = 'ptt';
        startCapture();
        showVoiceStatus(true, '🎤', '请说话...');
        return;
    }
    showVoiceStatus(true, '⏳', '启动本地语音识别...');
    warmupLocalASR('ptt', () => {
        if (localASR.ready && voiceEnabled) {
            startCapture();
            showVoiceStatus(true, '🎤', '请说话...');
        }
    });
}

function pttEnd() {
    if (!_pttActive) return;
    _pttActive = false;

    document.getElementById('pttButton').className = 'btn-primary-custom w-100 py-3 fs-5';
    document.getElementById('pttButton').textContent = '🎤 按住说话';

    // Sync fullscreen PTT button
    const fsPttBtn = document.getElementById('fsPttButton');
    if (fsPttBtn) { fsPttBtn.className = 'btn btn-primary w-100 py-2'; fsPttBtn.textContent = '🎤 按住说话'; }

    // Sync main chat panel PTT button
    const mainPtt = document.getElementById('btnPtt');
    if (mainPtt) { mainPtt.classList.remove('ptt-hold'); mainPtt.textContent = '🎤'; }

    showVoiceStatus(true, '⏳', '处理中...');

    // 无论 captureActive 状态如何，都停止采集并等待 ASR 结果
    // （自由对话模式的 VAD 可能已提前将 captureActive 设为 false）
    if (localASR.ready && localASR.ws && localASR.ws.readyState === WebSocket.OPEN) {
        stopCapture();

        new Promise((resolve) => {
            localASR.pendingResolve = resolve;
            setTimeout(() => {
                if (localASR.pendingResolve) {
                    console.log('[PTT] ASR result timeout, using pendingText:', localASR.pendingText);
                    localASR.pendingResolve(localASR.pendingText || '');
                    localASR.pendingResolve = null;
                }
            }, 5000);
        }).then(text => {
            if (text && isValidVoiceInput(text)) {
                showVoiceStatus(true, '📝', '识别完成');
                console.log('[PTT] sending:', text.substring(0, 50));
                sendVoiceText(text, false);
            } else {
                console.log('[PTT] no valid speech detected, text:', JSON.stringify(text));
                showVoiceStatus(true, '⏳', '未检测到语音');
                setTimeout(() => showVoiceStatus(false), 1500);
            }
        });
        return;
    }

    showVoiceStatus(false);
}

// Global listeners: stop PTT if mouse/touch released anywhere on the page
document.addEventListener('mouseup', () => { if (_pttActive) pttEnd(); });
document.addEventListener('touchend', () => { if (_pttActive) pttEnd(); });
document.addEventListener('touchcancel', () => { if (_pttActive) pttEnd(); });

// ─── Shared Voice Functions ──────────────────────────────────
function isValidVoiceInput(text) {
    if (!text || text.length < VOICE_TEXT_MIN_LENGTH) return false;
    if (text === voiceLastFinalText) return false;
    if (text === voiceLastSentText) {
        console.log('[Echo Reject] matches last sent:', text);
        return false;
    }
    if (voiceLastSentText && isTextSimilar(text, voiceLastSentText)) {
        console.log('[Echo Reject] similar to last sent:', text);
        return false;
    }
    // 回声检测：ASR 结果与数字人最近说的话相似 → 判定为回声
    for (const avatarText of _avatarRecentTexts) {
        if (isTextSimilar(text, avatarText)) {
            console.log('[Echo Reject] matches avatar speech:', text, '~', avatarText.substring(0, 30));
            return false;
        }
    }
    return true;
}

function isTextSimilar(a, b) {
    if (!a || !b) return false;
    const aWords = a.toLowerCase().replace(/[^\w一-鿿]/g, ' ').split(/\s+/).filter(Boolean);
    const bWords = b.toLowerCase().replace(/[^\w一-鿿]/g, ' ').split(/\s+/).filter(Boolean);
    if (aWords.length < 2 || bWords.length < 2) return false;
    const short = aWords.length <= bWords.length ? aWords : bWords;
    const long = aWords.length > bWords.length ? aWords : bWords;
    const match = short.filter(w => long.includes(w)).length;
    return match / short.length >= 0.7;
}

function startVoiceCooldown() {
    if (voiceCooldownTimer) { clearTimeout(voiceCooldownTimer); voiceCooldownTimer = null; }
    const jitter = VOICE_ECHO_COOLDOWN_MS * (0.8 + Math.random() * 0.4);
    voiceCooldownTimer = setTimeout(() => {
        voiceCooldownTimer = null;
        if (voiceMode === 'free' && voiceEnabled && !voiceWaitingForReply) {
            _restartFreeListening();
        }
    }, jitter);
    showVoiceStatus(true, '🔇', '冷却中...');
}

function _restartFreeListening() {
    if (!voiceEnabled || voiceWaitingForReply) return;

    // If already capturing, no action needed
    if (localASR.captureActive) return;

    // 数字人正在说话，不重启 ASR
    if (_avatarSpeaking) {
        console.log('[Voice] blocked: avatar still speaking');
        setTimeout(() => _restartFreeListening(), 1000);
        return;
    }
    // 数字人刚说完不到 2 秒，等待回声消散
    const sinceSpeak = Date.now() - _avatarSpeakEndTime;
    if (_avatarSpeakEndTime > 0 && sinceSpeak < VOICE_ECHO_COOLDOWN_MS) {
        const remain = VOICE_ECHO_COOLDOWN_MS - sinceSpeak;
        console.log('[Voice] echo cooldown,', Math.ceil(remain / 1000), 's remaining');
        setTimeout(() => _restartFreeListening(), remain);
        return;
    }

    // If connection is still alive, just start capture (which sends is_speaking:true)
    if (localASR.ready && localASR.ws && localASR.ws.readyState === WebSocket.OPEN) {
        showVoiceStatus(true, '🎤', '聆听中...');
        startCapture();
        return;
    }

    // Connection lost — full warmup needed
    showVoiceStatus(true, '🎤', '聆听中...（重新连接）');
    warmupLocalASR('free', () => {
        if (voiceMode === 'free' && voiceEnabled && !voiceWaitingForReply) startCapture();
    });
}

let _silenceRestartTimer = null;
function _restartAfterSilence() {
    // Restart listening after an empty/noise ASR result.
    // Debounced to prevent VAD→ASR→empty→restart infinite loops.
    if (!voiceEnabled || voiceMode !== 'free' || voiceWaitingForReply) return;
    if (_silenceRestartTimer) return; // Already pending
    _silenceRestartTimer = setTimeout(() => {
        _silenceRestartTimer = null;
        if (voiceEnabled && voiceMode === 'free' && !voiceWaitingForReply) {
            _restartFreeListening();
        }
    }, 500);
}

function sendVoiceText(text, interrupt) {
    if (!text || !sessionid) {
        console.warn('[Voice] sendVoiceText blocked:', { text: !!text, sessionid });
        return;
    }
    voiceWaitingForReply = true;
    voiceLastSentText = text;
    voiceLastFinalText = text;  // 标记为已处理，防止重复
    console.log('[Voice] sendVoiceText:', text.substring(0, 50));
    showVoiceStatus(true, '⏳', '处理中...');
    appendVoiceChatLog('user', text);
    showVoiceTranscript('', false);

    // Start total timeout — if reply never comes, recover
    if (voiceWaitingTimeout) clearTimeout(voiceWaitingTimeout);
    voiceWaitingTimeout = setTimeout(() => {
        if (voiceWaitingForReply) {
            console.warn('[Voice] Total reply timeout — recovering');
            _clearVoiceWaiting();
            appendVoiceChatLog('avatar', '(回复超时)');
            if (voiceMode === 'free' && voiceEnabled) _restartFreeListening();
        }
    }, VOICE_WAITING_MAX_MS);

    const type = document.getElementById('txtType').value;
    const ttsModel = document.getElementById('ttsModel').value;
    const ttsVoice = document.getElementById('ttsVoice').value;
    const body = { text, type, interrupt, sessionid: String(sessionid) };
    body.tts = { model: ttsModel, ref_file: ttsVoice };

    fetch('/human', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    }).then(r => r.json()).then(d => {
        console.log('[Voice] /human response:', d);
        if (d.code !== 0) {
            console.error('voice send error:', d);
            _clearVoiceWaiting();
            if (voiceMode === 'free' && voiceEnabled) startVoiceCooldown();
            return;
        }
        if (voiceMode === 'free') pollSpeakingEnd();
    }).catch(e => {
        console.error('voice send error:', e);
        _clearVoiceWaiting();
        if (voiceMode === 'free' && voiceEnabled) startVoiceCooldown();
    });
}

function _clearVoiceWaiting() {
    voiceWaitingForReply = false;
    if (voiceWaitingTimeout) { clearTimeout(voiceWaitingTimeout); voiceWaitingTimeout = null; }
    if (voicePollTimer) { clearInterval(voicePollTimer); voicePollTimer = null; }
}

function pollSpeakingEnd() {
    if (!voiceEnabled || !sessionid) return;
    showVoiceStatus(true, '🔊', '说话中...');
    const pollStartTime = Date.now();
    let avatarEverSpoke = false;

    voicePollTimer = setInterval(() => {
        if (!voiceEnabled || !sessionid) {
            _clearVoiceWaiting();
            return;
        }
        fetch('/is_speaking', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionid: String(sessionid) }),
        }).then(r => r.json()).then(d => {
            // Handle both old (boolean) and new (object) response format
            const speaking = typeof d.data === 'boolean' ? d.data : (d.data && d.data.speaking);
            const llmPending = d.data && typeof d.data === 'object' && d.data.llm_pending;

            // 更新数字人最近说的话（用于回声检测）
            if (d.data && d.data.recent_texts) {
                _avatarRecentTexts = d.data.recent_texts;
            }

            if (speaking) {
                avatarEverSpoke = true;
                _avatarSpeaking = true;
            }

            if (!speaking) {
                if (_avatarSpeaking) {
                    _avatarSpeaking = false;
                    _avatarSpeakEndTime = Date.now();
                }

                if (avatarEverSpoke) {
                    // Avatar finished speaking — normal end
                    _clearVoiceWaiting();
                    voiceRestartCount = 0;
                    appendVoiceChatLog('avatar', '(回复完成)');
                    if (voiceMode === 'free' && voiceEnabled) startVoiceCooldown();
                } else if (!llmPending && Date.now() - pollStartTime > VOICE_WAITING_START_MS) {
                    // LLM finished but avatar never spoke — error
                    console.warn('[Voice] LLM done but avatar never spoke');
                    _clearVoiceWaiting();
                    appendVoiceChatLog('avatar', '(未收到回复)');
                    if (voiceMode === 'free' && voiceEnabled) _restartFreeListening();
                }
            }
        }).catch(() => {});
    }, 500);
}

function showVoiceStatus(show, icon, text) {
    const bar = document.getElementById('voiceStatusBar');
    const iconEl = document.getElementById('voiceStatusIcon');
    const textEl = document.getElementById('voiceStatusText');

function showVoiceTranscript(text, interim) {

    el.style.display = 'block';
    el.textContent = text;
    el.style.opacity = interim ? '0.6' : '1';
}

function appendVoiceChatLog(role, text) {
    const log = document.getElementById('voiceChatLog');
    const div = document.createElement('div');
    div.className = role === 'user' ? 'msg-user' : 'msg-avatar';
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}

function stopVoiceMode() {
    voiceEnabled = false;
    voiceWaitingForReply = false;
    voiceRestartCount = 0;
    if (voiceRecognition) { try { voiceRecognition.stop(); } catch(e) {} voiceRecognition = null; }
    _teardownLocalASR();
    if (voiceCooldownTimer) { clearTimeout(voiceCooldownTimer); voiceCooldownTimer = null; }
    if (voiceWaitingTimeout) { clearTimeout(voiceWaitingTimeout); voiceWaitingTimeout = null; }
    if (_silenceRestartTimer) { clearTimeout(_silenceRestartTimer); _silenceRestartTimer = null; }
    if (voicePollTimer) { clearInterval(voicePollTimer); voicePollTimer = null; }
    showVoiceStatus(false);
}

// Override stop() to also stop voice mode
const _origStop = stop;
stop = function() {
    try { if (voiceMode !== 'off') resetVoiceMode(); } catch(e) { console.error('voice cleanup error:', e); }
    _origStop();
};

// ─── Fullscreen Side Panel ────────────────────────────────────
const _wrapper = document.getElementById('videoFullscreenWrapper');
let _isFullscreen = false;

function toggleFullscreen() {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
        const req = _wrapper.requestFullscreen || _wrapper.webkitRequestFullscreen;
        if (req) req.call(_wrapper);
    }
}

document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);

function onFullscreenChange() {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    _isFullscreen = (fsEl === _wrapper);
    if (_isFullscreen) {
        // Sync state into side panel（防御性：每个赋值都做空检查，避免因元素缺失导致整段崩溃）
        try {
            const fsVoiceMode = document.getElementById('fsVoiceMode');
            const voiceModeEl = document.getElementById('voiceMode');
            if (fsVoiceMode && voiceModeEl) fsVoiceMode.value = voiceModeEl.value;
            const fsPtt = document.getElementById('fsPttContainer');
            if (fsPtt && voiceModeEl) {
                fsPtt.style.display = (voiceModeEl.value === 'ptt') ? 'block' : 'none';
            }
            const fsTxtType = document.getElementById('fsTxtType');
            const txtTypeEl = document.getElementById('txtType');
            if (fsTxtType && txtTypeEl) fsTxtType.value = txtTypeEl.value;
            const fsTxtInt = document.getElementById('fsTxtInterrupt');
            const txtIntEl = document.getElementById('txtInterrupt');
            if (fsTxtInt && txtIntEl) fsTxtInt.checked = txtIntEl.checked;
            const fsTtsModel = document.getElementById('fsTtsModel');
            const ttsModelEl = document.getElementById('ttsModel');
            if (fsTtsModel && ttsModelEl) fsTtsModel.value = ttsModelEl.value;
            const fsTtsVoice = document.getElementById('fsTtsVoice');
            const ttsVoiceEl = document.getElementById('ttsVoice');
            if (fsTtsVoice && ttsVoiceEl) fsTtsVoice.value = ttsVoiceEl.value;
            const fsLog = document.getElementById('fsVoiceChatLog');
            const mainLog = document.getElementById('voiceChatLog');
            if (fsLog && mainLog) {
                fsLog.innerHTML = mainLog.innerHTML;
                fsLog.scrollTop = fsLog.scrollHeight;
            }
        } catch (e) {
            console.warn('[FullscreenSync] sync failed:', e);
        }
        // 进入全屏自动展开侧边控制面板（避免用户找不到入口）
        _wrapper.classList.add('fs-panel-open');
        const toggleBtn = document.getElementById('fsPanelToggle');
        if (toggleBtn) toggleBtn.classList.add('active');
    } else {
        _wrapper.classList.remove('fs-panel-open');
        const toggleBtn = document.getElementById('fsPanelToggle');
        if (toggleBtn) toggleBtn.classList.remove('active');
    }
}

function toggleFsPanel() {
    const open = _wrapper.classList.toggle('fs-panel-open');
    document.getElementById('fsPanelToggle').classList.toggle('active', open);
}

// Send text from fullscreen side panel
function sendFsText() {
    const fsInput = document.getElementById('fsTxtMessage');
    if (!fsInput.value.trim()) return;
    // Sync to main panel
    document.getElementById('txtMessage').value = fsInput.value;
    document.getElementById('txtType').value = document.getElementById('fsTxtType').value;
    document.getElementById('txtInterrupt').checked = document.getElementById('fsTxtInterrupt').checked;
    document.getElementById('ttsModel').value = document.getElementById('fsTtsModel').value;
    document.getElementById('ttsVoice').value = document.getElementById('fsTtsVoice').value;
    sendText();
    fsInput.value = '';
}

// Mirror voice chat log and status to fullscreen panel

appendVoiceChatLog = function(role, text) {
    _origAppendVoiceChatLog(role, text);
    if (_isFullscreen) {
        const fsLog = document.getElementById('fsVoiceChatLog');
        const div = document.createElement('div');

        div.textContent = text;
        fsLog.appendChild(div);

const _origShowVoiceStatus = showVoiceStatus;
showVoiceStatus = function(show, icon, text) {

        const bar = document.getElementById('fsVoiceStatusBar');

            bar.style.display = 'block';

};

const _origShowVoiceTranscript = showVoiceTranscript;
showVoiceTranscript = function(text, interim) {
    _origShowVoiceTranscript(text, interim);

function toggleConfigPanel() {
    var content = document.getElementById("configPanelContent");
    var icon = document.getElementById("panelToggleIcon");
    var text = document.getElementById("panelToggleText");
    if (!content) return;
    var isCollapsed = content.classList.contains("collapsed");

        if (icon) icon.className = "bi bi-chevron-down";
        if (text) text.innerText = "展开配置";
    }
}



let _webrtcLoaded = false;

function setWebRTCStep(step, title, subtext, icon) {
    if (_webrtcLoaded && step < 4) return; // 如果视频已播放，忽略滞后的中间步骤
    const overlay = document.getElementById('videoLoadingOverlay');
    if (!overlay) return;
    overlay.style.display = 'flex';
    overlay.style.opacity = '1';
    overlay.style.visibility = 'visible';

    if (title) document.getElementById('webrtcStepTitle').innerHTML = title;
    if (subtext) document.getElementById('webrtcStepSubtext').textContent = subtext;
    if (icon) document.getElementById('loadingIcon').className = 'bi ' + icon;

    for (let i = 1; i <= 4; i++) {
        const dot = document.getElementById('cdot' + i);
        if (!dot) continue;
        dot.classList.remove('active', 'done');
        if (i < step) dot.classList.add('done');
        else if (i === step) dot.classList.add('active');
    }
}

function hideWebRTCStep() {
    _webrtcLoaded = true;
    const overlay = document.getElementById('videoLoadingOverlay');
    if (!overlay) return;
    setWebRTCStep(4, '数字人连线就绪！', '正在呈现画面...', 'bi-check-lg');
    setTimeout(() => {
        overlay.style.opacity = '0';
        setTimeout(() => {
            overlay.style.display = 'none';
            overlay.style.visibility = 'hidden';
        }, 300);
    }, 200);
}

// 绑定视频元素的播放事件，保证画面一出立即关闭遮罩
document.addEventListener('DOMContentLoaded', () => {
    const v = document.getElementById('video');
    if (v) {
        v.addEventListener('playing', hideWebRTCStep);
        v.addEventListener('timeupdate', () => {
            if (v.currentTime > 0.1 && !_webrtcLoaded) hideWebRTCStep();
        });
    }
});



// Sync chat toolbar labels from main config selects
function syncChatToolbarLabels() {
    const typeLabel = document.getElementById('chatTxtTypeLabel');
    const ttsLabel = document.getElementById('chatTtsLabel');
    const txtTypeSel = document.getElementById('txtType');
    const ttsModelSel = document.getElementById('ttsModel');
    if (typeLabel && txtTypeSel) typeLabel.textContent = txtTypeSel.options[txtTypeSel.selectedIndex]?.text || 'Echo';
    if (ttsLabel && ttsModelSel) {
        const t = ttsModelSel.options[ttsModelSel.selectedIndex]?.text || '';
        ttsLabel.textContent = t.replace(' ✅','');
    }
}
// Run on load and whenever selects change
document.addEventListener('DOMContentLoaded', function() {
    syncChatToolbarLabels();
    ['ttsModel','ttsVoice','txtType'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('change', syncChatToolbarLabels);
    });
});


// ═══ Chat UI: unified send ════════════════════════════════════════
function sendChatText() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    if (!sessionid) { showChatStatus('⚠️', '请先连接 WebRTC'); return; }
    appendChatBubble('user', text);
    input.value = ''; autoResizeChatInput(input);
    const type = document.getElementById('txtType').value;
    const ttsModel = document.getElementById('ttsModel').value;
    const ttsVoice = document.getElementById('ttsVoice').value;
    showChatStatus('⏳', '发送中...');
    fetch('/human', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, type, interrupt: true, sessionid: String(sessionid),
            tts: { model: ttsModel, ref_file: ttsVoice } }),
    }).then(r => r.json()).then(d => {
        if (d.code !== 0) { showChatStatus('⚠️', '发送失败'); setTimeout(() => hideChatStatus(), 2000); return; }
        showChatStatus('🔊', '数字人回复中...');
        pollChatSpeakEnd();
    }).catch(() => { showChatStatus('⚠️', '网络错误'); setTimeout(() => hideChatStatus(), 2000); });
}

let _chatPollTimer = null;
function pollChatSpeakEnd() {
    if (_chatPollTimer) clearInterval(_chatPollTimer);
    let avatarEverSpoke = false;
    const startTime = Date.now();
    _chatPollTimer = setInterval(() => {
        if (!sessionid) { clearInterval(_chatPollTimer); return; }
        fetch('/is_speaking', { method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ sessionid: String(sessionid) }) })
        .then(r => r.json()).then(d => {
            const speaking = typeof d.data === 'boolean' ? d.data : (d.data && d.data.speaking);
            const llmPending = d.data && typeof d.data === 'object' && d.data.llm_pending;
            if (d.data && d.data.recent_texts) _avatarRecentTexts = d.data.recent_texts;
            if (speaking) { avatarEverSpoke = true; _avatarSpeaking = true; }
            if (!speaking) {
                if (_avatarSpeaking) { _avatarSpeaking = false; _avatarSpeakEndTime = Date.now(); }
                if (avatarEverSpoke) { clearInterval(_chatPollTimer); hideChatStatus(); appendChatBubble('avatar', '✅ 回复完成'); }
                else if (!llmPending && Date.now() - startTime > 15000) { clearInterval(_chatPollTimer); hideChatStatus(); appendChatBubble('avatar', '⚠️ 未收到回复'); }
            }
        }).catch(() => {});
    }, 500);
}

// ═══ Chat UI: bubble rendering ════════════════════════════════════
function appendChatBubble(role, text, opts) {
    opts = opts || {};
    const container = document.getElementById('chatMessages');
    if (!container) return;
    if (role === 'system') {
        const row = document.createElement('div'); row.className = 'bubble-system-row';
        const sp = document.createElement('span'); sp.className = 'bubble-system'; sp.textContent = text;
        row.appendChild(sp); container.appendChild(row); container.scrollTop = container.scrollHeight; return;
    }
    const row = document.createElement('div');
    row.className = 'bubble-row ' + role;
    if (opts.interim) row.dataset.interim = '1';
    const icon = document.createElement('div');
    icon.className = role === 'user' ? 'bubble-user-icon' : 'bubble-avatar-icon';
    icon.textContent = role === 'user' ? '🧑' : '🤖';
    const wrap = document.createElement('div');
    wrap.className = 'bubble-content';
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (opts.interim ? ' bubble-interim' : '');
    bubble.textContent = text;
    const ts = document.createElement('div');
    ts.className = 'bubble-timestamp';
    ts.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    wrap.appendChild(bubble); wrap.appendChild(ts);
    row.appendChild(icon); row.appendChild(wrap);
    container.appendChild(row); container.scrollTop = container.scrollHeight;
    return row;
}
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ═══ Chat status pill ═════════════════════════════════════════════
function showChatStatus(icon, text) {
    const row = document.getElementById('chatStatusRow');
    const pill = document.getElementById('chatStatusPill');
    if (!row || !pill) return;
    pill.innerHTML = '<span>' + icon + '</span>' + escapeHtml(text);
    row.style.display = 'flex';
}
function hideChatStatus() {
    const row = document.getElementById('chatStatusRow');
    if (row) row.style.display = 'none';
}

// ═══ Chat input helpers ═══════════════════════════════════════════
function autoResizeChatInput(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 96) + 'px';
}
function onChatInputKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatText(); }
}

// ═══ Mic buttons (自由对话 + 按住说话) ════════════════════════════
// 自由对话：点击切换 on/off
function toggleFreeMode() {
    const vmSel = document.getElementById('voiceMode');
    if (!sessionid) { alert('请先连接 WebRTC'); return; }
    if (vmSel.value === 'free') {
        vmSel.value = 'off'; onVoiceModeChange();
    } else {
        // 切换前先关闭其他模式
        if (vmSel.value !== 'off') { vmSel.value = 'off'; onVoiceModeChange(); }
        // 清理跨会话残留状态，避免 chat 文本发送后的回声误判
        _avatarRecentTexts = [];
        voiceLastFinalText = '';
        voiceLastSentText = '';
        vmSel.value = 'free'; onVoiceModeChange();
        showChatStatus('🎙️', '聆听中...');
    }
    syncMicButtons();
}

// 同步 UI：根据 voiceMode 状态更新按钮
function syncMicButtons() {
    const freeBtn = document.getElementById('btnFree');
    if (freeBtn) freeBtn.classList.toggle('active', document.getElementById('voiceMode').value === 'free');
    const pttBtn = document.getElementById('btnPtt');
    if (pttBtn) pttBtn.classList.remove('ptt-hold');
}

// ═══ Bridge: voice UI → chat bubbles ════════════════════════════
const _orig2ShowVoiceStatus = showVoiceStatus;
showVoiceStatus = function(show, icon, text) {
    _orig2ShowVoiceStatus(show, icon, text);
    if (show) { showChatStatus(icon, text); } else { hideChatStatus(); }
    // 同步麦克风按钮状态
    syncMicButtons();
    // PTT 按钮：仅在按住期间高亮
    const pttBtn = document.getElementById('btnPtt');
    if (pttBtn) {
        if (show && icon === '🎤' && document.getElementById('voiceMode').value === 'ptt') {
            pttBtn.classList.add('ptt-hold');
        } else if (!show || document.getElementById('voiceMode').value !== 'ptt') {
            pttBtn.classList.remove('ptt-hold');
        }
    }
};

const _orig2ShowVoiceTranscript = showVoiceTranscript;
showVoiceTranscript = function(text, interim) {
    _orig2ShowVoiceTranscript(text, interim);
    const chatInput = document.getElementById('chatInput');
    if (!chatInput) return;
    if (interim && text) {
        chatInput.placeholder = '🎤 ' + text + '...';
    } else {
        chatInput.placeholder = '输入文本发送 / 按住🎤说话 / 点击🎙️自由对话…';
        if (!interim && text) {
            // ASR 最终结果：填入输入框
            chatInput.value = text;
            autoResizeChatInput(chatInput);
        } else if (!interim && !text && chatInput.value) {
            // ASR 发送完成：清空输入框（避免残留文字）
            chatInput.value = '';
            autoResizeChatInput(chatInput);
        }
    }
};

const _orig2AppendVoiceChatLog = appendVoiceChatLog;
appendVoiceChatLog = function(role, text) {
    _orig2AppendVoiceChatLog(role, text);
    appendChatBubble(role === 'user' ? 'user' : 'avatar', text);
};
